M({
id:'sreshti', sec:'А3', code:'А3.2', title:'Организация на делови срещи и мероприятия', short:'Делови срещи',
t:4, p:12, days:['2026-11-26','2026-11-27','2026-11-30'],
intro:'Видове срещи, подготовка, протокол, бизнес срещи, представителни форуми и командировки.',
lessons:[
L('2.1','Видове делови срещи. Протокол. Представителни форуми',2,`
<ul><li><b>Оперативка</b> – кратка, редовна (седмична) среща за текущите задачи.</li><li><b>Събрание</b> – на членове или собственици, взимат се решения с гласуване (например общо събрание).</li><li><b>Съвещание</b> – обсъждане на конкретен проблем със специалисти.</li><li><b>Конференция</b> – голямо събитие с доклади и много участници.</li><li><b>Семинар / обучение</b> – с образователна цел.</li><li><b>Кръгла маса</b> – дискусия между равнопоставени участници.</li></ul>
<p><b>Протокол</b> се води, за да има запис на решенията. Той съдържа: номер, дата, място, присъстващи и отсъстващи, кворум, дневен ред, обсъждания накратко, взети решения (кой, какво, до кога), подписи на председателя и протоколчика.</p>
<p><b>След срещата:</b> изпращате протокола на участниците, следите изпълнението на решенията и архивирате документите.</p>
<p><b>Представителни форуми</b> (откриване, юбилей, прием на делегация) изискват списък с гости, покани 2–3 седмици по-рано, програма, водещ, подредба на местата по протокол, кетъринг, фотограф и медии.</p>`,
['Протоколът записва решенията: кой, какво, до кога.']),
L('2.2','Подготовка на деловата среща. Поведение на организаторите',2,`
<p><b>Чеклист за подготовка:</b></p>
<ol><li>Цел и дневен ред.</li><li>Участници, дата, час и продължителност.</li><li>Зала или онлайн платформа.</li><li><b>Уведомление</b> до участниците с дата, час, място, дневен ред и материали. Изпраща се навреме и се иска потвърждение.</li><li>Документи: присъствен списък, материали, табелки с имената, бланка за протокол.</li><li>Техника: проектор, лаптоп, удължител, микрофон, интернет. Проверява се предварително.</li><li>Вода, кафе, почерпка.</li></ol>
<p><b>Поведение на организаторите:</b> идват първи, посрещат гостите, облечени са подходящо и говорят учтиво. Решават проблемите спокойно и незабележимо.</p>
<p><b>Единство между език, жест и поза:</b> думите, тонът и тялото трябва да казват едно и също. Скръстените ръце, погледът в телефона и обръщането настрани изпращат негативно послание.</p>`,
['Уведомлението съдържа дата, час, място и дневен ред.','Техниката се проверява предварително.']),
L('П','Командировки и пътувания (практика)',0,`
<p><b>Командировка</b> е изпълнение на служебна задача извън мястото на работа. Тя се урежда от <b>Наредбата за командировките в страната</b> и <b>Наредбата за служебните командировки и специализации в чужбина</b>.</p>
<p><b>Документи:</b> <b>заповед за командировка</b> (кой, къде, за колко дни, с каква задача, с какъв транспорт, кой плаща) → <b>отчет</b> за командировката с разходооправдателни документи (билети, фактури за хотел) в определен срок след връщането.</p>
<p>Служителят получава <b>дневни пари</b>, <b>квартирни</b> и <b>пътни</b> разходи в размерите, определени от наредбите.</p>
<p><b>Резервационни системи:</b> онлайн сайтове за хотели и самолетни билети, автогари и БДЖ. Проверете условията за анулиране и поискайте фактура на името на фирмата.</p>`,
['Заповед преди пътуването, отчет след него.'])

M({
id:'dokum', sec:'А3', code:'А3.3', title:'Организация и съхранение на документация', short:'Документация и деловодство',
t:4, p:12, days:['2026-11-30','2026-12-01','2026-12-02'],
intro:'Основни понятия на кореспонденцията, видовете документи, документооборотът и архивът.',
lessons:[
L('3.1','Основни кореспондентски понятия',1,`
<ul><li><b>Документ</b> – материален или електронен носител на информация с правно значение.</li><li><b>Бланка</b> – лист с предварително отпечатани данни за организацията (лого, адрес, ЕИК).</li><li><b>Реквизит</b> – задължителен елемент на документа: наименование, вид, дата, рег. индекс, адресат, относно, текст, подпис, печат, приложения.</li><li><b>Документооборот</b> – движението на документите от създаването или получаването им до архива.</li><li><b>Документация</b> – съвкупността от документи по дадена дейност.</li><li><b>Регистрационен индекс</b> – номер и дата на регистриране.</li></ul>
<p><b>Кореспонденцията</b> е цялата служебна писмена комуникация. Неин <b>предмет</b> са правилата за създаване и обработка на документите. <b>Обект</b> са самите документи.</p>`,
['Реквизитите са задължителните елементи на документа.']),
L('3.2','Видове документи',1,`
<ul><li><b>Заявление</b> – искане по установен ред, често по образец (за удостоверение, за отпуск).</li><li><b>Молба</b> – искане, чието удовлетворяване зависи от преценката на адресата.</li><li><b>Служебна бележка</b> – удостоверява факт (например, че лицето работи във фирмата). Издава се по искане на служителя.</li><li><b>Удостоверение</b> – официален документ от институция, който доказва факт или право.</li><li><b>Доклад / докладна записка</b> – информира ръководителя и предлага решение.</li><li><b>Протокол</b> – от заседание, приемо-предавателен, констативен.</li><li><b>Вътрешна справка</b> – обобщени данни по запитване.</li><li><b>Формуляри, шаблони и образци</b> – готови бланки за еднотипни документи. Спестяват време и намаляват грешките.</li></ul>
<p><b>Структура на заявление:</b> адресат (горе вдясно) → наименование „ЗАЯВЛЕНИЕ“ → данни за заявителя → текст („Моля да ми бъде издадено…“) → приложения → дата и място (долу вляво) → подпис (долу вдясно).</p>`,
['Заявлението е по установен ред, молбата зависи от преценката на адресата.']),
L('3.3','Документооборот и деловодство',1,`
<p><b>ЕДСД</b> (Единна държавна система за деловодство) е създадена, за да уеднакви правилата за работа с документи в учрежденията. Днес тези правила се прилагат чрез <b>електронни деловодни системи</b> и правилата на електронното управление.</p>
<p><b>Нормативна рамка:</b> Закон за електронното управление, Закон за електронния документ и електронните удостоверителни услуги, Закон за Националния архивен фонд, вътрешни правила за деловодството.</p>
<p><b>Организация на деловодството:</b></p>
<ul><li><b>Централизирана</b> – едно деловодство за цялата организация.</li><li><b>Децентрализирана</b> – всяко звено регистрира само.</li><li><b>Смесена</b>.</li></ul>
<p><b>Изисквания за движение на документите:</b> най-кратък път, без излишни връщания, регистриране при всяко движение, контрол на сроковете.</p>
<p><b>Информационни регистри:</b> входящ, изходящ и вътрешен дневник, регистър на договорите, на заповедите, на жалбите.</p>`,
['Всеки документ се регистрира и движи по най-краткия път.']),
L('3.4','Вътрешни, външни и изходящи документи. Архив',1,`
<ul><li><b>Входящи (външни)</b> – получени от други организации или граждани.</li><li><b>Изходящи</b> – изпратени от организацията навън.</li><li><b>Вътрешни</b> – движат се само вътре (заповеди, докладни, вътрешни справки).</li></ul>
<p><b>Номенклатура на делата</b> е списъкът на делата (папките) на организацията с индекси и срокове за съхранение.</p>
<p><b>Срокове за съхранение</b> – определят се в номенклатурата и закона. Например счетоводните документи и ведомостите за заплати се пазят по Закона за счетоводството (ведомостите – 50 години, регистрите и отчетите – 10 години, а някои първични документи – 3 до 10 години).</p>
<p><b>Архив:</b> приключените дела се подреждат, описват и предават в учрежденския архив с <b>опис</b>. Документите с историческа стойност се предават в Държавна агенция „Архиви“. Документите с изтекъл срок се унищожават с протокол след експертиза.</p>`,
['Номенклатурата на делата определя индекси и срокове.','Ведомостите за заплати се пазят 50 години.'])
],
quiz:[
Q('Кой документ удостоверява, че лицето работи във фирмата?',['Молба','Служебна бележка','Протокол','Докладна'],1,'Служебната бележка удостоверява факт.'),
Q('Задължителният елемент на документа се нарича…',['реквизит','бланка','индекс','архив'],0,'Реквизитите са задължителните елементи на документа.'),
Q('Заповедта на управителя до служителите е…',['входящ документ','изходящ документ','вътрешен документ','външен документ'],2,'Тя се движи само в организацията.'),
Q('Колко години се пазят ведомостите за заплати?',['3','5','10','50'],3,'По Закона за счетоводството ведомостите се пазят 50 години.'),
Q('Къде пише датата в заявлението?',['Горе вдясно','Долу вляво','В заглавието','Не се пише'],1,'Датата и мястото са долу вляво, а подписът – долу вдясно.')
],
ex:[
X('Съставете документи','Съставете: заявление за издаване на служебна бележка, молба за неплатен отпуск, докладна записка за повреден принтер.','Проверяват се реквизитите: адресат, наименование, данни за подателя, ясен текст, дата, подпис. В докладната трябва да има и предложение за решение.'),
X('Номенклатура на делата','Изгответе номенклатура от 8 дела за малък офис с индекси и срокове за съхранение.','Пример: 01 Заповеди – постоянно; 02 Входяща кореспонденция – 5 г.; 03 Изходяща – 5 г.; 04 Договори – 10 г.; 05 Фактури – 10 г.; 06 Ведомости за заплати – 50 г.; 07 Трудови досиета – 50 г.; 08 Протоколи – постоянно.'),
X('Пътят на документа','Начертайте пътя на писмо от НАП: от получаването до архива.','Получаване → регистриране (вх. №) → резолюция от управителя → счетоводство → отговор (изх. №) → подпис → изпращане → подреждане в дело → архив.'),
X('Шаблон в Word','Създайте шаблон за бланка на фирма с лого, данни, място за регистрационен индекс и подпис.','Шаблонът се записва като .dotx. Проверяват се колонтитулът, полетата и подравняването.')

gl:[G('Бланка','Лист с отпечатани данни на организацията.'),G('Документооборот','Движението на документите от създаването до архива.'),G('Номенклатура на делата','Списък на делата с индекси и срокове за съхранение.'),G('ЕДСД','Единна държавна система за деловодство.'),G('Докладна записка','Документ до ръководителя с информация и предложение.')],

M({
id:'ikt', sec:'А3', code:'А3.4', title:'Информационни и комуникационни технологии в административните и офис дейности', short:'ИКТ в офиса',
t:8, p:48, days:['2026-12-02','2026-12-03','2026-12-04','2026-12-07','2026-12-08','2026-12-09','2026-12-10','2026-12-11'],
intro:'Софтуер, търсене на информация, организация на файлове, документи, таблици, презентации, електронни услуги и авторско право.',
lessons:[
L('4.1','Информационни технологии в администрацията. Видове софтуер',1,`
<p><b>Видове софтуер:</b></p>
<ul><li><b>Локален</b> – инсталиран на компютъра (Microsoft Office, LibreOffice).</li><li><b>Онлайн</b> – работи в браузъра (Gmail, Google Docs).</li><li><b>Облачен</b> – данните и програмата са на сървъри в интернет и са достъпни отвсякъде (Microsoft 365, Google Workspace).</li></ul>
<p><b>Офис приложения:</b> текстообработка (Word, Docs), електронни таблици (Excel, Sheets), презентации (PowerPoint, Slides), имейл и календар (Outlook, Gmail).</p>
<p><b>Специализирани бизнес системи:</b> счетоводни програми, системи за заплати и ЧР, деловодни системи, ERP (цялостно управление на фирмата), CRM (отношения с клиенти).</p>
<p><b>Лицензи:</b> платен, безплатен, с отворен код, абонамент.</p>`,
['Локален – на компютъра; облачен – в интернет и достъпен отвсякъде.']),
L('4.2','Търсене и обработка на информация в интернет',1,`
<p><b>Техники за търсене:</b></p>
<ul><li><b>"точна фраза"</b> в кавички;</li><li><b>-дума</b> изключва дума;</li><li><b>site:gov.bg</b> търси само в сайтове на държавата;</li><li><b>filetype:pdf</b> търси само PDF файлове;</li><li>филтри по дата („Последната година“).</li></ul>
<p><b>Как да проверите достоверността на източника:</b> Кой е авторът или институцията? Кога е публикувано? Има ли цитирани източници? Пише ли и другаде същото? Целта е да информира или да продава? Предпочитайте официални сайтове (.gov.bg, институции).</p>`,
['Кавички, site:, filetype: и филтрите по дата правят търсенето по-точно.']),
L('4.3','Съхранение и организация на цифрова информация',1,`
<p><b>Структура на папките</b> – логична и еднаква: <i>Година → Тема → Подтема</i>, например <code>2026 / Договори / Доставчици</code>.</p>
<p><b>Именуване на файлове:</b> кратко и ясно, с дата във формат ГГГГ-ММ-ДД, без интервали и специални символи. Пример: <code>2026-11-16_Protokol_Operativka.docx</code>.</p>
<p><b>Архивиране (backup):</b> правило <b>3-2-1</b> – 3 копия, на 2 различни носителя, като 1 копие е на друго място (облак). Компресиране в .zip.</p>
<p><b>Облачно съхранение:</b> OneDrive, Google Drive, Dropbox. Споделяне с права „преглед“ или „редакция“.</p>`,
['Дата в името на файла: ГГГГ-ММ-ДД.','Правило 3-2-1 за резервни копия.']),
L('4.4','Специализирани бизнес приложения',1,`
<p>В офиса често се работи с приложения за конкретни задачи:</p>
<ul><li><b>Счетоводен софтуер</b> – фактури, дневници, ДДС.</li><li><b>Системи за заплати и ЧР</b> – досиета, отпуски, ведомости.</li><li><b>Деловодни системи</b> – регистриране и движение на документи.</li><li><b>Електронни регистри</b> – Търговски регистър, имотен регистър, регистри в общината.</li><li><b>Портали за електронни услуги</b> – НАП, НОИ, egov.bg, сайтът на общината.</li></ul>
<p><b>Добри практики при въвеждане на данни:</b> проверявайте всяко поле, използвайте падащите списъци, не копирайте данни от непроверени източници и запазвайте често.</p>`,
['Бизнес приложенията са за конкретни задачи: счетоводство, ЧР, деловодство.']),
L('4.5','Създаване на дигитално съдържание',1,`
<p>Дигиталното съдържание включва текстове, таблици, изображения и комбинирани документи (например брошура с текст, снимки и таблица).</p>
<p><b>Правила:</b> един стил на шрифтовете (до 2 вида), ясна йерархия на заглавията, качествени изображения с разрешение за ползване, четлив контраст.</p>
<p><b>Формати:</b> .docx (Word), .xlsx (Excel), .pptx (PowerPoint), <b>.pdf</b> (за изпращане без промени), .jpg/.png (изображения).</p>
<p><b>Експорт в PDF:</b> Файл → Запиши като → PDF. Така документът изглежда еднакво навсякъде.</p>`,
['PDF се ползва, когато документът не трябва да се променя.']),
L('4.6','Функции за редактиране и оформление',1,`
<ul><li><b>Стилове</b> (Заглавие 1, Заглавие 2, Нормален) – дават еднакво оформление и автоматично съдържание.</li><li><b>Форматиране на шрифт</b> – вид, размер, удебелен, курсив, цвят.</li><li><b>Форматиране на абзац</b> – подравняване, отстъп, междуредие, разстояние преди и след.</li><li><b>Страница</b> – полета, ориентация, размер (A4), номерация, колонтитули.</li><li><b>Проследяване на промени</b> и коментари – при съвместна работа.</li><li><b>Проверка на правописа</b>.</li></ul>
<p><b>Полезни клавишни комбинации:</b> Ctrl+C (копирай), Ctrl+V (постави), Ctrl+X (изрежи), Ctrl+Z (отмени), Ctrl+S (запиши), Ctrl+F (търси), Ctrl+P (печат), Ctrl+B (удебелен).</p>`,
['Стиловете осигуряват еднакво оформление.']),
L('4.7','Бланки, шаблони и фирмена документация',1,`
<p><b>Шаблонът</b> е файл с готово оформление, в който се попълват само променливите данни. Във Word се записва като <b>.dotx</b>.</p>
<p><b>Фирмена бланка:</b> лого и данни в горния колонтитул (име, адрес, ЕИК, телефон, имейл), а в долния – банкова сметка или уебсайт.</p>
<p><b>Готови образци</b> има в Word (Файл → Ново), на сайтовете на институциите (НАП, общината) и в счетоводните програми.</p>
<p><b>Сливане на документи (Mail Merge)</b> създава много писма, пликове или етикети от един шаблон и таблица с данни.</p>`,
['Шаблоните спестяват време и уеднаквяват документите.']),
L('4.8','Авторско право и защита на цифровото съдържание',1,`
<p><b>Законът за авторското право и сродните му права</b> защитава текстове, снимки, музика, софтуер и видео. Авторът сам решава кой и как да ползва творбата му.</p>
<ul><li>Не използвайте снимки от интернет без разрешение. Не всичко в Google е свободно.</li><li><b>Лицензи Creative Commons</b> позволяват ползване при условия (например с посочване на автора: CC BY).</li><li>Безплатни източници на снимки с ясни лицензи: Pixabay, Unsplash, Pexels.</li><li>Софтуерът се ползва с лиценз. Пиратските програми са незаконни и опасни (вируси).</li></ul>
<p><b>Защита на цифровото съдържание:</b> силни пароли (поне 12 знака, различни за всеки сайт), двуфакторна идентификация, актуализации, антивирусна програма. Внимавайте с подозрителни имейли (<b>фишинг</b>): не отваряйте непознати прикачени файлове и проверявайте адреса на подателя.</p>`,
['Не всичко в интернет е свободно за ползване.','Силна парола + двуфакторна идентификация.'])
],

t:16, p:44, days:['2026-12-11','2026-12-14','2026-12-15','2026-12-16','2026-12-17','2026-12-18','2026-12-21','2026-12-22'],
intro:'Windows и файлове, интернет и електронни услуги, онлайн комуникация, както и практическа работа с Word, Excel и PowerPoint.',
lessons:[
L('1.1','Операционни системи. Windows и файловата система',2,`
<p><b>Операционната система</b> управлява компютъра и програмите. Видове: Windows, macOS, Linux, а за телефони – Android и iOS.</p>
<p><b>Работното пространство в Windows:</b> работен плот (Desktop), лента на задачите (Taskbar), меню „Старт“, икони, прозорци, кошче.</p>
<p><b>Файловата система:</b> дискове (C:, D:) → папки → файлове. Файлът има <b>име</b> и <b>разширение</b> (.docx, .xlsx, .pdf, .jpg).</p>
<p><b>File Explorer</b> (Win + E): навигационен панел вляво, адресна лента, лента за търсене, изгледи (иконки, списък, подробности). Основни действия: нова папка (Ctrl+Shift+N), преименуване (F2), копиране, преместване, изтриване (Del) и възстановяване от кошчето.</p>`,
['Win + E отваря File Explorer.','F2 преименува файл.']),
L('1.2','Търсене и изтегляне на информация',2,`
<p><b>Браузър</b> (Chrome, Edge, Firefox) – адресна лента, раздели (Ctrl+T), отметки (Ctrl+D), история (Ctrl+H).</p>
<p><b>Изтегляне:</b> файловете отиват в папка „Изтегляния“ (Downloads). Изтегляйте само от официални сайтове и проверявайте разширението. Файл .exe от непознат сайт може да е вирус.</p>
<p>Запазване на страница като PDF: Ctrl+P → „Запиши като PDF“.</p>`,
['Изтегляйте само от официални сайтове.']),
L('1.3','Електронни услуги. Електронен подпис',2,`
<p><b>Електронни услуги:</b> онлайн пазаруване, електронно банкиране, плащане на данъци и такси (НАП, общината), справки в НОИ, записване на час при лекар.</p>
<p><b>Безопасност:</b> проверявайте катинара и <b>https://</b> в адреса, не въвеждайте данни от карта на непознати сайтове, използвайте 3D Secure кода от банката. Банката никога не иска ПИН по телефона или имейла.</p>
<p><b>Електронен подпис:</b> електронни данни, които идентифицират подписващия. <b>Квалифицираният електронен подпис (КЕП)</b> има силата на саморъчен подпис в целия ЕС (Регламент eIDAS). Издава се от доставчици на удостоверителни услуги. Има КЕП с карта и четец и облачен КЕП (в мобилно приложение).</p>`,
['КЕП = силата на саморъчния подпис.','Банката никога не иска ПИН.']),
L('1.4','Онлайн комуникация и общности',4,`
<p><b>Онлайн общности:</b> социални мрежи (Facebook, Instagram, LinkedIn – професионална мрежа), форуми, групи, месинджъри (Viber, WhatsApp, Messenger).</p>
<p><b>Софтуер за аудио- и видеоразговори:</b> Zoom, Microsoft Teams, Google Meet, Viber, WhatsApp.</p>
<p><b>Основни функции:</b> създаване и споделяне на връзка за среща, включване и изключване на микрофона и камерата, споделяне на екрана, чат, вдигане на ръка, запис (само със съгласие на участниците), размазан фон.</p>
<p><b>Правила:</b> професионален профил и снимка, без лична информация в публичните профили, внимателно с приятелства с непознати.</p>`,
['LinkedIn е професионална мрежа.','Записът на среща изисква съгласие.']),
L('1.5','Електронна поща и облачни технологии',6,`
<p><b>Доставчици на електронна поща:</b> безплатни (Gmail, Outlook.com, ABV) и фирмени (собствен домейн, например <code>ime@firma.bg</code>).</p>
<p><b>Работа с поща:</b> регистрация → нов имейл (До, Копие, Скрито копие, Тема, Текст, Прикачен файл) → получаване → <b>Отговор</b> / <b>Отговор до всички</b> / <b>Препращане</b> → изтриване и възстановяване → папки и етикети → подпис → спам.</p>
<p><b>Облачни технологии:</b> съхранение (Google Drive, OneDrive), съвместна работа в реално време (Google Docs, Microsoft 365), календар, споделяне с права „Преглед“, „Коментиране“ и „Редактиране“, история на версиите.</p>
<p><b>Предимства:</b> достъп отвсякъде, по-малък риск от загуба, съвместна работа. <b>Рискове:</b> нужен е интернет, сигурността зависи от паролата, а има и въпроси за поверителността на данните.</p>`,
['„Отговор до всички“ – само когато всички трябва да видят отговора.','Облакът позволява съвместна работа в реално време.']),
L('П1','Word: създаване и форматиране на документ',8,`
<p><b>Правила при въвеждане на текст:</b> Enter се натиска само в края на абзаца, а не в края на реда. Интервалът се поставя след препинателния знак, не преди него. Не се използват много интервали за подравняване, а табулации или подравняване.</p>
<p><b>Непечатаеми символи</b> (¶, Ctrl+Shift+8) показват интервали, абзаци и табулации. Полезни са при проверка на оформлението.</p>
<p><b>Форматиране:</b> шрифт (Times New Roman или Calibri, 12 pt), абзац (подравняване от двете страни, междуредие 1,15), полета на страницата.</p>`,
['Enter – само в края на абзаца.','Непечатаемите символи помагат при проверка.']),
L('П2','Word: табулации, списъци, колони, символи, колонтитули',4,`
<ul><li><b>Табулации</b> – подравняване на текст на определено място (вляво, вдясно, по центъра, по десетичната запетая).</li><li><b>Списъци</b> – с водещи символи или с номерация, многостепенни.</li><li><b>Колони</b> – Оформление → Колони (за бюлетини).</li><li><b>Символи</b> – Вмъкване → Символ (€, ©, №, °).</li><li><b>Изгледи</b> – оформление за печат, четене, уеб. <b>Мащабиране</b> (Ctrl + колелцето на мишката).</li><li><b>Горен и долен колонтитул</b> – повтарящ се текст на всяка страница. Там се поставя номерацията.</li><li><b>Търсене и заместване</b> – Ctrl+H.</li><li><b>Отмяна и възстановяване</b> – Ctrl+Z / Ctrl+Y.</li></ul>`,
['Ctrl+H – търсене и заместване.']),
L('П3','Word: графика, таблици, визитка, сливане, пликове',6,`
<ul><li><b>Графични обекти:</b> Вмъкване → Картини, Фигури, WordArt (художествен текст), Текстово поле. Обтичане на текста.</li><li><b>OLE (свързване и вграждане):</b> таблица от Excel може да се <b>вгради</b> (копие в документа) или да се <b>свърже</b> (обновява се, когато се промени Excel файлът).</li><li><b>Таблици:</b> Вмъкване → Таблица; добавяне и изтриване на редове и колони; сливане и разделяне на клетки; граници и запълване.</li><li><b>Визитка</b> (стандартен размер 9 × 5 см) – с таблица или с шаблон.</li><li><b>Сливане (Mail Merge):</b> <b>главен документ</b> (писмото) + <b>източник на данни</b> (таблица с имена и адреси) = <b>слят документ</b> (много персонализирани писма).</li><li><b>Пликове:</b> Пощенски съобщения → Пликове. Адресът на подателя е горе вляво, а на получателя – долу вдясно.</li></ul>`,
['Сливане = главен документ + източник на данни.']),
L('П4','Excel: въвеждане, форматиране, формули, функции',10,`
<p><b>Работен прозорец:</b> работна книга → листове → клетки (адрес: колона + ред, например <b>B3</b>), лента за формули, поле за име.</p>
<p><b>Типове данни:</b> текст, числа, дати, формули. <b>Автоматично запълване</b> – дърпа се маркерът в долния десен ъгъл на клетката (месеци, дни, поредни числа, формули).</p>
<p><b>Форматиране:</b> числов формат (валута €, процент, дата), подравняване, обединяване, граници, стилове на таблици, условно форматиране.</p>
<p><b>Формулите</b> започват със знака <b>=</b>. Пример: <code>=B2*C2</code>.</p>
<p><b>Вградени функции:</b> <code>=SUM(B2:B10)</code> сбор, <code>=AVERAGE(...)</code> средна, <code>=MAX(...)</code>, <code>=MIN(...)</code>, <code>=COUNT(...)</code> брой, <code>=IF(B2&gt;100;"Да";"Не")</code> условие.</p>
<p><b>Видове адреси:</b> <b>относителен</b> (B2) се променя при копиране; <b>абсолютен</b> ($B$2) остава същият; <b>смесен</b> ($B2 или B$2). Клавиш <b>F4</b> превключва между видовете.</p>`,
['Формулите започват с =.','$B$2 е абсолютен адрес (F4).']),
L('П5','Excel: обобщаващи таблици, диаграми, печат',4,`
<p><b>Обобщаваща таблица (Pivot Table):</b> Вмъкване → Обобщаваща таблица. Полетата се плъзгат в Редове, Колони, Стойности и Филтри. Бързо обобщава големи таблици (например продажби по служители и месеци).</p>
<p><b>Обобщаваща диаграма (Pivot Chart)</b> – графика към обобщаващата таблица.</p>

var wake=null, wakeWanted=false;
function wakeSupported(){return 'wakeLock' in navigator;}
function setWake(on){
  wakeWanted=on;
  if(!on){if(wake){wake.release().catch(function(){});wake=null;}updWake();return Promise.resolve(true);}
  if(!wakeSupported()){updWake('Телефонът или браузърът не поддържа тази функция.');return Promise.resolve(false);}
  return navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;updWake();});updWake();return true;},
    function(){wakeWanted=false;updWake(inFrame?'Тук не е разрешено. Отворете учебника в браузъра или инсталирайте приложението.':'Не успях да включа функцията.');return false;});

function sha(s){
  if(!(window.crypto&&crypto.subtle))return Promise.reject();
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});
}

var lessonMode='slides', NAV=[], goingBack=false;
function go(h){if(location.hash===h)route();else location.hash=h;}
function goBack(){
  if(NAV.length>1){var before=location.hash,prev=NAV[NAV.length-2];
    try{history.back();}catch(e){}
    setTimeout(function(){if(location.hash===before){goingBack=true;try{location.replace(prev);}catch(e){location.hash=prev;}}},350);}
  else go(parentOf(location.hash));}
function parentOf(h){var m;h=h||'#home';
  if((m=h.match(/^#l-([a-z]+)-\d+$/)))return '#m-'+m[1];
  if((m=h.match(/^#m-([a-z]+)-/)))return '#m-'+m[1];
  return '#home';}
function route(){
  var hh=location.hash||'#home';
  if(goingBack){NAV.pop();goingBack=false;}
  else if(NAV.length>1&&NAV[NAV.length-2]===hh)NAV.pop();

  if($('#slide'))renderSlide();
  var bb=$('#backBtn'); bb.hidden=(hh==='#home'&&NAV.length<=1);

    reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w||firstSW)return;w.addEventListener('statechange',function(){if(w.state==='activated')toast('Има нова версия на учебника. Ще се зареди при следващото отваряне.');});});
  }).catch(function(){});}
function toast(t){var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},6000);}
function netState(){var o=navigator.onLine===false;document.body.classList.toggle('offline',o);var p=document.getElementById('offpill');if(p)p.hidden=!o;}
window.addEventListener('online',netState);window.addEventListener('offline',netState);
route();netState();
(function(){var ua=navigator.userAgent||'';var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(ios&&!standalone&&!inFrame&&/^https:$/.test(location.protocol))setTimeout(function(){showInstallBar(true);},1500);})();
