<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Учебник „Административни и офис дейности“</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Идея: стилът на презентациите на учителя – топла хартия, тъмносиньо, синьо за темите и оранжево за въпросите. Лява навигация, вдясно – урокът. */
:root{
  --paper:#f3efe6; --sheet:#fbf9f4; --ink:#1f2a35; --muted:#5d6670; --line:#e2ddd1;
  --accent:#2b6a8a; --accent-soft:#e2edf2; --stamp:#b5501f; --stamp-soft:#f7e7dd;
  --ok:#2f7d4f; --ok-soft:#e2f2e8; --warn:#9a6a00; --warn-soft:#fbf1d9;
  --font-display:"Montserrat", "Segoe UI", Arial, sans-serif;
  --font-body:"Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono:"Inter", "Segoe UI", Arial, sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11171d; --sheet:#18212a; --ink:#e4e9ee; --muted:#9aa7b3; --line:#2a3642;
  --accent:#6fb3cf; --accent-soft:#1c3340; --stamp:#e2786c; --stamp-soft:#3a2321;
  --ok:#6cc391; --ok-soft:#1b3326; --warn:#e0b45a; --warn-soft:#352b15; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#11171d; --sheet:#18212a; --ink:#e4e9ee; --muted:#9aa7b3; --line:#2a3642;
  --accent:#6fb3cf; --accent-soft:#1c3340; --stamp:#e2786c; --stamp-soft:#3a2321;
  --ok:#6cc391; --ok-soft:#1b3326; --warn:#e0b45a; --warn-soft:#352b15; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.85rem} h2{font-size:1.4rem} h3{font-size:1.12rem}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--sheet);border-right:1px solid var(--line);padding:18px 14px 30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px;text-decoration:none;color:inherit}
.brand small{font-family:var(--font-mono);font-size:.72rem;color:var(--stamp);letter-spacing:.04em}
.brand b{font-family:var(--font-display);font-size:1.08rem;line-height:1.25}
.nav-sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 8px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3}
.nav a:hover{background:var(--accent-soft)}
.nav a.on{background:var(--accent);color:#fff}
.nav a.on .ring{--track:rgba(255,255,255,.35);--fill:#fff}
.nav .code{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);min-width:38px}
.nav a.on .code{color:rgba(255,255,255,.85)}
.ring{--p:0;--track:var(--line);--fill:var(--ok);width:18px;height:18px;border-radius:50%;flex:none;margin-left:auto;background:conic-gradient(var(--fill) calc(var(--p)*1%),var(--track) 0)}
.ring::after{content:"";display:block;width:10px;height:10px;margin:4px;border-radius:50%;background:var(--sheet)}
.nav a.on .ring::after{background:var(--accent)}
/* top */
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 28px;border-bottom:1px solid var(--line);background:var(--sheet);position:sticky;top:0;z-index:5}
.top .menu{display:none}
.top .crumbs{flex:1;min-width:0;font-size:.9rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.9rem;text-decoration:none;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.stamp{background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.stamp{background:var(--stamp-soft);color:var(--stamp)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.view{padding:28px;max-width:1040px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.mod-card:hover{border-color:var(--accent)}
.mod-card h3{font-size:1.02rem}
.regidx{font-family:var(--font-mono);font-size:.74rem;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:1px 6px;align-self:flex-start;letter-spacing:.03em}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.today{border-left:4px solid var(--stamp)}
.today .date{font-family:var(--font-mono);color:var(--stamp);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
.li:hover .t{color:var(--accent)}
.li .n{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);min-width:34px}
.li .t{flex:1}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:#fff}
.check.done{background:var(--ok);border-color:var(--ok)}
/* lesson */
.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius);padding:28px 32px}
.prose{max-width:68ch}
.prose p{margin:.7em 0}
.prose ul,.prose ol{padding-left:1.3em;margin:.6em 0}
.prose li{margin:.3em 0}
.prose code{font-family:var(--font-mono);font-size:.88em;background:var(--paper);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.prose .ex{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:1em 0}
.prose .formula{font-family:var(--font-mono);background:var(--paper);border:1px dashed var(--line);padding:10px 14px;border-radius:8px;text-align:center}
.keys{background:var(--ok-soft);border-radius:var(--radius);padding:14px 18px}
.keys h3{font-size:1rem;margin-bottom:6px;color:var(--ok)}
.keys ul{margin:0;padding-left:1.2em}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* quiz */
.q{display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--sheet)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.why{font-size:.92rem;color:var(--muted);padding-left:4px}
.score{font-family:var(--font-display);font-size:1.4rem}
/* exercises */
.exr{display:flex;flex-direction:column;gap:10px}
.exr textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);resize:vertical}
.answer{background:var(--warn-soft);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.95rem}
.answer b{color:var(--warn)}
/* glossary */
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
dl.gl{margin:0;display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0}
dl.gl dt,dl.gl dd{padding:10px 8px;border-bottom:1px solid var(--line);margin:0}
dl.gl dt{font-weight:600}
dl.gl dd .pill{margin-left:6px}
/* schedule */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;text-align:center}
tr.past td{color:var(--muted)}
tr.now td{background:var(--stamp-soft)}
td a{text-decoration:none}
/* teacher */
.teacher-only{display:none}
body.teacher .teacher-only{display:block}
body.teacher .teacher-inline{display:inline-flex}
.teacher-inline{display:none}
.tpanel{border:1.5px dashed var(--stamp);background:var(--stamp-soft);border-radius:var(--radius);padding:16px 20px}
.tpanel h3{color:var(--stamp);font-size:1rem;margin-bottom:6px}
.tpanel ol{margin:0;padding-left:1.3em}
.tpanel textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sheet);margin-top:6px}
.tbadge{white-space:nowrap;background:var(--stamp);color:#fff;font-size:.75rem;padding:3px 9px;border-radius:999px;font-weight:600}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--sheet);border-radius:12px;padding:22px;width:100%;max-width:400px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.field input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.err{color:var(--stamp);font-size:.88rem;min-height:1.2em}
/* projector */
body.proj .side,body.proj .top{display:none}
body.proj .app{grid-template-columns:1fr}
body.proj .view{max-width:none;padding:3vw 6vw}
body.proj .lesson{border:0;padding:0;background:transparent}
body.proj .prose{max-width:none;font-size:1.65rem;line-height:1.5}
body.proj h1{font-size:2.8rem}
body.proj .no-proj{display:none!important}
.proj-exit{display:none;position:fixed;top:14px;right:14px;z-index:40}
body.proj .proj-exit{display:inline-flex}
/* timer */
.timer{font-family:var(--font-mono);font-size:2.6rem;font-variant-numeric:tabular-nums;text-align:center}
.timer.end{color:var(--stamp)}
.picked{font-family:var(--font-display);font-size:1.8rem;text-align:center;min-height:1.5em}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:86%;max-width:320px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  body.navopen .side{transform:none}
  .top{padding:10px 16px}
  .top .menu{display:inline-flex}
  .view{padding:18px 16px}
  .hero{grid-template-columns:1fr}
  .lesson{padding:20px 18px}
  dl.gl{grid-template-columns:1fr}
  dl.gl dt{border-bottom:0;padding-bottom:0}
  .top .hide-sm{display:none}
  .top .crumbs{display:none}
  .top .menu{margin-right:auto}
}

/* slides – стилът на презентациите на учителя */
.deck{display:flex;flex-direction:column;gap:10px}
.deck-hidden{display:none}
.stage{container-type:inline-size;width:100%}
.slide{--sb:#f3efe6;--sc:#fbf9f4;--sl:#e2ddd1;--sn:#1f2a35;--blue:#2b6a8a;--or:#b5501f;--mut:#5d6670;
  background:var(--sb);color:var(--sn);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;overflow:hidden;
  font-family:"Inter","Segoe UI",Arial,sans-serif;padding:22px 20px 34px;min-height:52vh;user-select:none;color-scheme:light}
.slide h2{font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-weight:800;font-size:1.35rem;line-height:1.2;color:var(--sn);margin:0 0 10px;text-wrap:balance}
.s-in{display:flex;flex-direction:column;gap:12px;flex:1}
.s-foot{position:absolute;left:20px;bottom:10px;font-size:.66rem;color:var(--mut)}
.s-title{background:#1f2a35;justify-content:center}
.s-title h2{color:#fff;font-size:1.9rem}
.s-title .s-bar{width:44px;height:4px;background:var(--or);border-radius:2px}
.s-title .s-kick{color:#e7935f;font-weight:600;font-size:.8rem}
.s-title .s-sub{color:#d5dbe0;font-size:.95rem}
.s-section{background:var(--blue);justify-content:center}
.s-section .s-in,.s-big .s-in,.s-title .s-in{justify-content:center}
.s-section h2,.s-big h2{color:#fff;font-size:1.8rem}
.s-section .s-kick{color:#f2c9a6;font-weight:600;font-size:.82rem}
.s-section .s-sub,.s-big .s-sub{color:#e6eef3;font-size:1rem}
.s-call{background:rgba(15,40,60,.35);color:#fff;border-radius:8px;padding:12px 14px;font-size:.95rem}
.s-big{background:var(--or)}
.s-big .s-sub{color:#fbe4d6}
.s-big .s-foot,.s-section .s-foot,.s-title .s-foot{color:rgba(255,255,255,.7)}
.s-lead{margin:0;font-size:1rem;line-height:1.45}
.slide b{font-weight:700}
.s-cards{display:grid;grid-template-columns:1fr;gap:8px}
.s-card{background:var(--sc);border:1px solid var(--sl);border-radius:8px;padding:10px 12px}
.s-card h4{margin:0 0 3px;font-family:"Montserrat",Arial,sans-serif;font-weight:700;font-size:.95rem}
.s-card p{margin:0;font-size:.88rem;color:#3c4650;line-height:1.4}
.s-nums{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.s-nums li{display:flex;gap:10px;align-items:flex-start;font-size:.98rem;line-height:1.35}
.s-nums li span{flex:none;width:24px;height:24px;border-radius:4px;background:var(--or);color:#fff;font-weight:700;font-size:.82rem;display:grid;place-items:center}
.s-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.s-list li{position:relative;padding-left:18px;font-size:.98rem;line-height:1.35}
.s-list li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;border-radius:2px;background:var(--or)}
.s-tw{overflow-x:auto}
.s-tbl{width:100%;border-collapse:collapse;font-size:.82rem;background:var(--sc)}
.s-tbl th{background:#1f2a35;color:#fff;text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:700;padding:6px 8px}
.s-tbl td{padding:6px 8px;border-bottom:1px solid var(--sl);color:var(--sn)}
.s-tbl tr:nth-child(even) td{background:#efe9dc}
.s-ex{background:var(--sc);border-left:4px solid var(--or);border-radius:0 6px 6px 0;padding:9px 12px;font-size:.88rem;line-height:1.4}
.s-note{margin:0;font-size:.86rem;color:var(--mut)}
.s-idx{font-family:"Montserrat",Arial,sans-serif;font-weight:800;color:var(--blue);font-size:1.35rem;text-align:center;padding:6px 0}
.s-mail{background:var(--sc);border:1px solid var(--sl);border-radius:8px;padding:12px 14px;font-size:.88rem}
.s-mail p{margin:0 0 4px}.s-mail b{color:var(--or)}
.dia{width:100%;height:auto;font-family:"Inter",Arial,sans-serif}
.sd{display:grid;grid-template-columns:1fr;gap:10px}
.sd-t p{margin:0 0 6px;font-size:.9rem}
.s-ctl{display:flex;align-items:center;gap:10px}
.s-mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem}
.s-dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.s-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.s-dots i.on{background:var(--stamp);width:18px;border-radius:4px}
.snote{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.95rem;line-height:1.5}
.snote b{color:var(--warn)}
.btn.big{padding:12px 18px;font-size:1rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
@container (min-width:640px){
  .slide{aspect-ratio:16/9;min-height:0;padding:5.2cqw 6cqw 4cqw;font-size:1.6cqw}
  .slide h2{font-size:3.1cqw;margin-bottom:1.6cqw}
  .s-title h2,.s-section h2,.s-big h2{font-size:4.6cqw}
  .s-title .s-kick,.s-section .s-kick{font-size:1.5cqw}
  .s-title .s-sub,.s-section .s-sub,.s-big .s-sub{font-size:1.9cqw}
  .s-call{font-size:1.65cqw;padding:1.8cqw 2.2cqw;max-width:80%}
  .s-in{gap:1.8cqw}
  .s-lead,.s-nums li,.s-list li{font-size:1.75cqw}
  .s-nums li span{width:2.6cqw;height:2.6cqw;font-size:1.4cqw}
  .s-cards{grid-template-columns:repeat(3,1fr);gap:1.4cqw}
  .s-cards.c2{grid-template-columns:repeat(2,1fr)} .s-cards.c4{grid-template-columns:repeat(4,1fr)}
  .s-card{padding:1.6cqw 1.8cqw}.s-card h4{font-size:1.7cqw}.s-card p{font-size:1.45cqw}
  .s-tbl{font-size:1.4cqw}.s-tbl th{font-size:1.35cqw;padding:.8cqw 1.2cqw}.s-tbl td{padding:.7cqw 1.2cqw}
  .s-ex,.s-mail{font-size:1.5cqw}.s-note,.sd-t p{font-size:1.45cqw}
  .s-idx{font-size:3.6cqw}
  .s-foot{font-size:1cqw;left:6cqw;bottom:2.2cqw}
  .sd{grid-template-columns:1.1fr 1fr;align-items:center}
  .dia{max-height:26cqw}
}
body.proj{background:#111}
body.proj .view>.stack>*:not(.deck){display:none}
body.proj .deck{display:flex;justify-content:center;min-height:100vh;gap:8px}
body.proj .stage{width:min(100%,calc((100vh - 70px)*16/9));margin:0 auto}
body.proj .slide{border-radius:0}
body.proj .s-ctl{width:min(100%,calc((100vh - 70px)*16/9));margin:0 auto;color:#ccc}
body.proj .view{padding:8px}
.tnote{margin:0;font-size:.85rem;color:var(--stamp);font-weight:600}
/* tasks */
.task{display:flex;flex-direction:column;gap:10px}
.tbody{display:flex;flex-direction:column;gap:12px}

// А1. Обща професионална подготовка
M({
id:'zbut', sec:'А1', code:'А1.1', title:'Здравословни и безопасни условия на труд и опазване на околната среда', short:'ЗБУТ и околна среда',
t:8, p:0, days:['2026-11-10'],
intro:'Как да работим безопасно в офиса, какво да направим при пожар, травма или бедствие и как да изхвърляме отпадъците правилно.',
lessons:[
L('1.1','Нормативни документи по охрана на труда',1,`
<p>Безопасността на работното място в България се урежда от няколко основни нормативни акта:</p>
<ul>
<li><b>Кодекс на труда (КТ)</b> – общите права и задължения на работодателя и работника, включително за безопасен труд.</li>
<li><b>Закон за здравословни и безопасни условия на труд (ЗЗБУТ)</b> – основният закон в областта. Задължава работодателя да оценява риска и да предприема мерки.</li>
<li><b>Наредби</b> към закона – например за инструктажите, за работа с компютри (видеодисплеи), за личните предпазни средства.</li>
</ul>
<p><b>Кой отговаря?</b> Работодателят носи основната отговорност. Той създава <b>Комитет</b> или <b>Група по условия на труд</b>, сключва договор със <b>Служба по трудова медицина</b> и прави <b>оценка на риска</b> за всяко работно място.</p>
<p>Работникът е длъжен да спазва правилата, да използва предпазните средства и да съобщава веднага за опасни ситуации.</p>`,
['ЗЗБУТ е основният закон за безопасността на труда.','Работодателят оценява риска и осигурява безопасни условия.','Работникът спазва правилата и сигнализира за опасност.']),
L('1.2','Разпоредби и инструкции за конкретната трудова дейност',1,`
<p>Всеки нов служител преминава през <b>инструктажи</b>. Те се записват в книга за инструктажите и се подписват от служителя.</p>
<ul>
<li><b>Начален</b> – при постъпване на работа, общи правила за фирмата.</li>
<li><b>На работното място</b> – конкретни опасности и правила за длъжността.</li>
<li><b>Периодичен</b> – повтаря се през определен период.</li>
<li><b>Извънреден</b> – при промяна на технология, след трудова злополука или нарушение.</li>
<li><b>Ежедневен</b> – при дейности с повишена опасност.</li>
</ul>
<p><b>Работа с компютър в офиса:</b> екранът е на една ръка разстояние, горният ръб е на нивото на очите. Столът е регулируем, стъпалата стоят на пода. Препоръчва се кратка почивка или смяна на дейността на всеки час работа пред екрана. Кабелите не трябва да минават през пътеките.</p>`,
['Инструктажите са 5 вида и се документират с подпис.','Ергономичното работно място предпазва гърба, очите и ръцете.']),
L('1.3','Мерки, защитни средства, сигнализация и маркировка',1,`
<p>Мерките за безопасност се прилагат в следния ред:</p>
<ol><li>Отстраняване на опасността.</li><li>Технически мерки (обезопасяване на машини, вентилация).</li><li>Организационни мерки (график, почивки, обучение).</li><li>Лични предпазни средства (ръкавици, очила, обувки), когато другите мерки не стигат.</li></ol>
<p><b>Знаци за безопасност</b> – запомнете цветовете и формите:</p>
<ul>
<li><b>Червен кръг с черта</b> – забрана (напр. „Пушенето забранено“).</li>
<li><b>Жълт триъгълник</b> – предупреждение за опасност (ток, хлъзгав под).</li>
<li><b>Син кръг</b> – задължение (носете ръкавици).</li>
<li><b>Зелен правоъгълник</b> – безопасност, авариен изход, първа помощ.</li>
<li><b>Червен правоъгълник</b> – противопожарно оборудване (пожарогасител, кран).</li>
</ul>`,
['Предпазните средства са последната, а не първата мярка.','Зелено = изход/помощ; червено = забрана или пожарно оборудване; жълто = внимание; синьо = задължение.']),
L('1.4','Прояви на професионален стрес',1,`
<p><b>Професионалният стрес</b> възниква, когато изискванията на работата надхвърлят възможностите или ресурсите на човека.</p>
<p><b>Чести причини в офиса:</b> много задачи с кратки срокове, неясни отговорности, конфликти, недоволни клиенти, постоянни прекъсвания, несигурност.</p>
<p><b>Признаци:</b></p>
<ul><li>Физически – главоболие, умора, нарушен сън, напрежение във врата и раменете.</li>
<li>Емоционални – раздразнителност, тревожност, чувство за безсилие.</li>
<li>Поведенчески – грешки, забравяне, отлагане, отсъствия.</li></ul>
<p><b>Какво помага:</b> списък със задачи по приоритет, реални срокове, кратки почивки, ясна комуникация с ръководителя, граници между работа и личен живот. Продължителният стрес може да доведе до <b>професионално прегаряне (бърнаут)</b>. Тогава е важно да се потърси подкрепа.</p>`,
['Стресът се проявява физически, емоционално и в поведението.','Планиране и ясна комуникация намаляват стреса.']),
L('1.5','Пожарна и аварийна безопасност',1,`
<p><b>При пожар:</b> запазете спокойствие → подайте сигнал на <b>112</b> → предупредете колегите → ако е безопасно, гасете малък пожар с пожарогасител → евакуирайте се по обозначените пътища. <b>Не използвайте асансьора.</b> При дим се движете ниско до пода.</p>
<p><b>Класове пожари и гасене:</b></p>
<ul>
<li><b>A</b> – твърди материали (хартия, дърво, текстил) – вода, пяна, прах.</li>
<li><b>B</b> – течности (бензин, разтворители) – пяна, прах, CO<sub>2</sub>.</li>
<li><b>C</b> – газове – прах, като първо се спира подаването на газ.</li>
<li><b>F</b> – олио и мазнини в кухня – специален пожарогасител или противопожарно одеяло. <b>Никога с вода!</b></li>
<li><b>Електрически уреди</b> под напрежение – CO<sub>2</sub> или прах. <b>Не с вода!</b></li>
</ul>
<p>Как се използва пожарогасител: <b>дърпате</b> предпазителя, <b>насочвате</b> към основата на пламъка, <b>натискате</b> ръкохватката и <b>движите</b> струята наляво-надясно.</p>`,
['Спешен телефон: 112.','Електрически уреди не се гасят с вода.','При евакуация не се ползва асансьор.']),
L('1.6','Видове травми и долекарска помощ',1,`
<p>Първо се уверете, че мястото е безопасно за вас. След това се обадете на <b>112</b>, когато е нужно.</p>
<ul>
<li><b>Рана</b> – сложете чиста марля или кърпа и притиснете, за да спрете кървенето. Не вадете забити предмети.</li>
<li><b>Навяхване</b> (разтягане на връзки) – покой, студен компрес (лед, увит в кърпа), стегнат бинт, крайникът се държи повдигнат.</li>
<li><b>Изкълчване</b> (ставата излиза от мястото си) – <b>не наместваме</b>. Обездвижваме в положението, в което е.</li>
<li><b>Фрактура</b> (счупване) – обездвижваме мястото с шина, включително ставите над и под него. При открита фрактура покриваме раната стерилно.</li>
<li><b>Електрически удар</b> – първо изключете тока или отделете пострадалия с непроводим предмет (сухо дърво).</li>
</ul>
<p>Аптечката в офиса трябва да е обозначена със зелен знак и да се проверява редовно.</p>`,
['При изкълчване и фрактура не наместваме – обездвижваме.','При удар от ток първо изключете захранването.']),
L('1.7','Поведение при бедствия, аварии и катастрофи',1,`
<p><b>Земетресение:</b> по време на труса останете вътре. Застанете под здрава маса или до носеща стена, далеч от прозорци и шкафове. След труса излезте спокойно по стълбите и се отдалечете от сгради и стълбове.</p>
<p><b>Наводнение:</b> изключете тока и газта, качете се на по-високо място и не минавайте през течаща вода.</p>
<p><b>Промишлена авария с опасни вещества:</b> следвайте указанията на властите. Обикновено се влиза в сграда, затварят се прозорците, а за дишане се използва навлажнена кърпа.</p>
<p><b>Пътна катастрофа:</b> обезопасете мястото (аварийни светлини, светлоотразителна жилетка, триъгълник), обадете се на 112 и окажете помощ, ако можете.</p>
<p>Всяка фирма има <b>план за действие при бедствия</b> и провежда учебни евакуации. Запомнете къде са изходите и мястото за събиране.</p>`,
['При земетресение: под масата, далеч от прозорците.','Знайте евакуационния план и мястото за събиране.']),
L('1.8','Опазване на околната среда и отпадъци',1,`
<p>Разделното събиране намалява отпадъците, които отиват на сметището, и позволява материалите да се рециклират.</p>
<ul>
<li><b>Жълт контейнер</b> – пластмаса и метал (бутилки, кенчета, опаковки).</li>
<li><b>Син контейнер</b> – хартия и картон.</li>
<li><b>Зелен контейнер</b> – стъкло.</li>
</ul>
<p><b>Опасни отпадъци в офиса</b> не се изхвърлят в обикновения кош:</p>

<p><b>Зелен офис:</b> печатайте двустранно и само при нужда, изключвайте техниката вечер, използвайте чаши за многократна употреба.</p>`,

M({
id:'ikon', sec:'А1', code:'А1.2', title:'Икономика и предприемачество', short:'Икономика и предприемачество',
t:8, p:0, days:['2026-11-11'],
intro:'Основни икономически понятия, как работи пазарът и какво прави един предприемач.',
lessons:[
L('2.1','Икономиката като наука. Субекти, ресурси и потребности',2,`
<p><b>Икономиката</b> изучава как хората, фирмите и държавата разпределят <b>ограничените ресурси</b>, за да задоволят <b>неограничените потребности</b>.</p>
<p><b>Ресурси (фактори на производството):</b></p>
<ul><li><b>Земя</b> – природни ресурси;</li><li><b>Труд</b> – човешките усилия и умения;</li><li><b>Капитал</b> – машини, сгради, пари за инвестиции;</li><li><b>Предприемачество</b> – умението ресурсите да се съчетаят в бизнес.</li></ul>
<p><b>Потребности</b> – първични (храна, жилище, облекло) и вторични (образование, развлечения). Според Маслоу те се подреждат в пирамида: физиологични → сигурност → принадлежност → уважение → себеизява.</p>
<p><b>Икономически субекти:</b> домакинства, фирми, държава и чужбина. <b>Ролята на държавата</b> в пазарната икономика е да създава правила (закони), да събира данъци, да осигурява обществени блага (пътища, отбрана, образование), да подпомага социално слабите и да пази конкуренцията.</p>
<p>Основни икономически проблеми са инфлацията (покачване на цените), безработицата и икономическият растеж.</p>`,
['Ресурсите са ограничени, потребностите – не.','Четири фактора: земя, труд, капитал, предприемачество.']),
L('2.2','Пазар, търсене и предлагане, конкуренция',3,`
<p><b>Пазар</b> е всяко място (физическо или онлайн), където купувачи и продавачи разменят стоки и услуги срещу пари.</p>
<p><b>Видове пазари:</b> на стоки и услуги, на труда, финансов (пари, акции), местен, национален, международен.</p>
<p><b>Търсене</b> е количеството, което купувачите искат и могат да купят при дадена цена. <b>Законът за търсенето</b> гласи, че когато цената се покачва, търсеното количество намалява.</p>
<p><b>Предлагане</b> е количеството, което продавачите искат да продадат. Когато цената се покачва, предлаганото количество се увеличава.</p>
<p><b>Пазарно равновесие</b> е цената, при която търсеното и предлаганото количество са равни. Ако цената е по-висока, остават непродадени стоки (излишък) и цената пада. Ако е по-ниска, стоката не стига (дефицит) и цената се покачва. Това е <b>ценовият механизъм</b>.</p>
<p><b>Конкуренцията</b> е съперничество между фирмите за клиенти. Тя води до по-ниски цени, по-добро качество и нови продукти.</p>
<div class="ex">Пример: През лятото в Рудозем има много малини и цената пада. През зимата малините са малко и цената се покачва.</div>`,
['Цената се покачва → търсенето пада, предлагането расте.','Равновесието е при пресичане на търсенето и предлагането.']),
L('2.3','Предприемачеството – същност и принципи',2,`
<p><b>Предприемачеството</b> е способността да видиш възможност, да поемеш разумен риск и да организираш ресурси, за да създадеш бизнес или нова стойност.</p>
<p><b>Принципи на предприемаческата дейност:</b> инициатива, иновация, поемане на отговорност за риска, ориентация към клиента, ефективно използване на ресурсите, постоянство.</p>
<p><b>Движещи сили на предприемаческия дух:</b> желание за независимост, идея за решение на проблем, финансова мотивация, личностна реализация, примери от семейството и общността.</p>
<p><b>Форми на бизнес в България:</b> Едноличен търговец (ЕТ), Еднолично дружество с ограничена отговорност (ЕООД), Дружество с ограничена отговорност (ООД), Акционерно дружество (АД). Има и социални предприятия и кооперации.</p>
<p>Стъпки към бизнес: идея → проучване на пазара → бизнес план → финансиране (лични средства, кредит, програми и грантове) → регистрация → старт.</p>`,
['Предприемачът вижда възможност и поема разумен риск.','Най-честите форми за малък бизнес: ЕТ и ЕООД.']),
L('2.4','Предприемачески умения',1,`
<ul>
<li><b>Вземане на решения:</b> определяне на проблема → варианти → оценка на плюсове и минуси → избор → действие → проверка на резултата.</li>
<li><b>Анализ и решаване на проблеми:</b> питайте „Защо?“ няколко пъти, за да стигнете до първопричината.</li>
<li><b>Проактивна нагласа:</b> действате преди проблемът да стане голям и търсите възможности, вместо да чакате.</li>
<li><b>Управление на информацията:</b> събиране, проверка на източниците и подреждане на данните.</li>
<li><b>Творчество и иновации:</b> мозъчна атака, нови комбинации от познати неща.</li>
<li><b>Личностни умения:</b> комуникация, работа в екип, самодисциплина, управление на времето, устойчивост при неуспех.</li>
</ul>`,
['Добрите решения следват ясни стъпки.','Проактивност означава да действаш преди проблема.'])
],
quiz:[
Q('Кое НЕ е фактор на производството?',['Труд','Капитал','Земя','Реклама'],3,'Факторите са земя, труд, капитал и предприемачество.'),
Q('Ако цената на стока се покачи, търсеното количество обикновено…',['се увеличава','намалява','не се променя','става нула'],1,'Това е законът за търсенето.'),

M({
id:'delkom', sec:'А2', code:'А2.1', title:'Делова комуникация', short:'Делова комуникация',
t:4, p:12, days:['2026-11-12','2026-11-13'],
intro:'Как да общуваме професионално на живо, по телефона, по имейл и онлайн, и как да движим служебната кореспонденция.',
lessons:[
L('1.1','Видове комуникация. Бизнес етикет',1,`
<p><b>Комуникацията</b> е обмен на информация между подател и получател. Тя минава през канал и завършва с обратна връзка.</p>
<ul><li><b>Вербална</b> – с думи, устно.</li><li><b>Невербална</b> – жестове, поза, мимика, тон, дистанция. Тя носи голяма част от посланието.</li><li><b>Писмена</b> – писма, доклади, бележки.</li><li><b>Електронна</b> – имейл, чат, видеосрещи.</li></ul>
<p><b>Функции на бизнес комуникацията:</b> да информира, да убеди, да координира работата и да изгражда отношения.</p>
<p><b>Стилове:</b> асертивен (ясен и уважителен, най-ефективен), пасивен, агресивен.</p>
<p><b>Бизнес етикет:</b> точност, подходящо облекло, ръкостискане и представяне с име и длъжност, обръщение на „Вие“, без прекъсване на събеседника. Телефонът е на тихо по време на срещи.</p>`,
['Асертивният стил е ясен и уважителен.','Невербалното поведение трябва да съвпада с думите.']),
L('1.2','Активно слушане и обратна връзка',1,`
<p><b>Активното слушане</b> означава да чуете и да разберете какво ви казва събеседникът.</p>
<ul><li>Гледайте събеседника и кимайте.</li><li><b>Перифразирайте:</b> „Ако правилно разбирам, искате…“</li><li>Задавайте <b>отворени въпроси</b> („Какво…?“, „Как…?“) за информация и <b>затворени</b> („Да/Не“) за потвърждение.</li><li>Не прекъсвайте и не съдете предварително.</li><li>Обобщете накрая.</li></ul>
<p><b>Обратната връзка</b> трябва да е конкретна, навременна и насочена към действието, а не към човека. Полезна е техниката „сандвич“: положително → какво да се подобри → насърчение.</p>
<p><b>Удовлетвореност на клиента</b> се проверява с кратък въпрос в края („Успях ли да ви помогна?“), анкета или книга за мнения.</p>`,
['Перифразиране и отворени въпроси са основа на активното слушане.','Обратната връзка е за действието, не за човека.']),
L('1.3','Професионален имейл, телефон, онлайн срещи, нететикет',1,`
<p><b>Структура на професионален имейл:</b></p>
<ol><li><b>Тема</b> – кратка и ясна („Заявка за офис консумативи – ноември“).</li><li><b>Обръщение</b> – „Уважаема г-жо Петрова,“.</li><li><b>Текст</b> – цел в първото изречение, кратки абзаци.</li><li><b>Заключение</b> – какво очаквате и до кога.</li><li><b>Поздрав и подпис</b> – име, длъжност, организация, телефон.</li></ol>
<p><b>Делови телефонен разговор:</b> вдигнете до третото позвъняване и се представете („Фирма „Х“, Мария Иванова, добър ден“). Записвайте името, телефона и въпроса. Обобщете какво сте договорили. Ако прехвърляте разговора, обяснете към кого.</p>
<p><b>Онлайн срещи:</b> изпратете покана с връзка и дневен ред. Влезте 5 минути по-рано, с изключен микрофон, когато не говорите. Внимавайте с осветлението и фона.</p>
<p><b>Нететикет:</b> не пишете само с главни букви (това означава викане). Проверявайте получателите, преди да натиснете „Отговор до всички“. Отговаряйте в рамките на работния ден и не препращайте лични данни без нужда.</p>`,
['Темата на имейла казва за какво става дума.','По телефона: представяне, записване, обобщение.']),
L('1.4','Административни документи. Входяща и изходяща поща',1,`
<p><b>Основни документи в служебната кореспонденция:</b> писмо, заявление, молба, докладна записка, заповед, протокол, служебна бележка, удостоверение, справка.</p>
<p><b>Регистриране:</b> всеки входящ и изходящ документ получава <b>регистрационен индекс</b> в деловодния регистър (дневник или електронна система).</p>
<div class="ex">Пример: <b>08-00-125/16.11.2026</b>. „08-00“ е индекс по номенклатурата на делата, 125 е поредният номер, а накрая е датата.</div>
<p><b>Входяща поща:</b> приемане → проверка за приложенията → регистриране → резолюция от ръководителя → насочване към изпълнител → изпълнение → архив.</p>
<p><b>Изходяща поща:</b> изготвяне → подпис → регистриране с изходящ номер → изпращане (поща, куриер, имейл, ССЕВ) → копие в делото.</p>
<p><b>Пренасочване:</b> документът отива при длъжностното лице, което отговаря по темата. Например фактура отива в счетоводството, а молба за отпуск – в „Човешки ресурси“. При неяснота се пита ръководителят.</p>`,
['Всеки документ получава регистрационен индекс.','Резолюцията определя кой изпълнява.'])

M({
id:'gdpr', sec:'А2', code:'А2.2', title:'Защита на лични данни и съблюдаване на Общия регламент относно защитата на данните', short:'Лични данни (GDPR)',
t:4, p:0, days:['2026-11-16'],
intro:'Какво са личните данни, какви права имат хората и как офисът трябва да пази информацията.',
lessons:[
L('2.1','Общият регламент (GDPR): цел, принципи, права, санкции',2,`
<p><b>Регламент (ЕС) 2016/679</b> (GDPR) се прилага от <b>25 май 2018 г.</b> във всички страни от ЕС. В България се допълва от <b>Закона за защита на личните данни</b>. Надзорен орган е <b>Комисията за защита на личните данни (КЗЛД)</b>.</p>
<p><b>Лични данни</b> са всяка информация, по която може да се идентифицира човек: име, ЕГН, адрес, телефон, имейл, снимка, IP адрес. <b>Специални категории</b> са здраве, етнос, религия, политически възгледи и биометрични данни. Те се защитават още по-строго.</p>
<p><b>Седем принципа:</b> законосъобразност, добросъвестност и прозрачност; ограничение на целите; свеждане на данните до минимум; точност; ограничение на съхранението; цялостност и поверителност; отчетност.</p>
<p><b>Права на хората (субектите на данни):</b> на информация, на достъп, на коригиране, на изтриване („да бъдеш забравен“), на ограничаване, на преносимост, на възражение и да не бъдат обект само на автоматизирано решение.</p>
<p><b>Задължения на организацията:</b> да има основание за обработването, да информира хората, да пази данните, да води регистри и при нужда да назначи длъжностно лице по защита на данните.</p>
<p><b>Санкции:</b> до <b>20 млн. евро или 4%</b> от годишния световен оборот (по-високата сума).</p>`,
['Лични данни = всичко, по което можем да разпознаем човек.','КЗЛД е надзорният орган в България.','Глоби до 20 млн. € или 4% от оборота.']),
L('2.2','Процедури за обработка на лични данни',2,`
<p><b>Основания за обработване</b> (поне едно е задължително): съгласие, изпълнение на договор, законово задължение, жизненоважни интереси, обществен интерес, легитимен интерес.</p>
<p><b>Жизнен цикъл на данните в офиса:</b></p>
<ol><li><b>Събиране</b> – само нужните данни, като човекът се информира за целта.</li><li><b>Регистриране и документиране</b> – в регистър на дейностите по обработване.</li><li><b>Съхранение и защита</b> – заключени шкафове, пароли, ограничен достъп, заключен екран.</li><li><b>Използване и предаване</b> – само за целта и само на оправомощени лица.</li><li><b>Изтриване</b> – след изтичане на срока (с шредер или сигурно изтриване).</li></ol>
<p><b>Искане за достъп:</b> отговаря се <b>до 1 месец</b>. Срокът може да се удължи с още 2 месеца при сложни случаи.</p>
<p><b>Нарушение на сигурността</b> (изгубен лаптоп, имейл до грешен адрес, хакерска атака): незабавно се уведомява ръководителят. Организацията уведомява КЗЛД <b>до 72 часа</b>, а при висок риск – и засегнатите хора.</p>
<div class="ex">Добра практика: не оставяйте документи с ЕГН на бюрото. Използвайте „Скрито копие“ (BCC) при масови имейли. Не снимайте документи с личния телефон.</div>`,
['Нужно е правно основание за всяко обработване.','Отговор на искане: до 1 месец.','Нарушение: уведомяване на КЗЛД до 72 часа.'])
],

Q('Кое от изброените е лична информация?',['Цената на хляба','Имейл адрес на служител','Името на фирмата','Работното време на офис'],1,'Личен имейл адрес идентифицира конкретен човек.'),

Q('Какво означава „свеждане на данните до минимум“?',['Събиране на възможно най-много данни','Събиране само на нужните за целта данни','Изтриване на всички данни','Съхраняване само на хартия'],1,'Събират се само данните, необходими за конкретната цел.'),

M({
id:'ustoich', sec:'А2', code:'А2.3', title:'Устойчиво икономическо развитие и зелени умения', short:'Устойчиво развитие',
t:4, p:0, days:['2026-11-16'],
intro:'Какво е устойчиво развитие и кръгова икономика и как бизнесът влияе на природата.',
lessons:[
L('3.1','Устойчиво развитие и кръгова икономика',2,`
<p><b>Устойчиво развитие</b> е развитие, което задоволява нуждите на днешното поколение, без да лишава бъдещите поколения от възможността да задоволят своите (Доклад „Брундтланд“, ООН, 1987).</p>
<p><b>Три стълба:</b> икономически (печалба и работни места), социален (справедливост и здраве) и екологичен (опазване на природата).</p>
<p><b>Линейна икономика:</b> добиваме → произвеждаме → изхвърляме. <b>Кръгова икономика:</b> продуктите и материалите се използват възможно най-дълго.</p>
<ul><li><b>Намали</b> (Reduce) – по-малко суровини и опаковки;</li><li><b>Използвай повторно</b> (Reuse);</li><li><b>Поправи</b> (Repair);</li><li><b>Рециклирай</b> (Recycle).</li></ul>
<p><b>Екологични стандарти:</b> <b>ISO 14001</b> (система за управление на околната среда), <b>EMAS</b> (европейска схема), екомаркировката на ЕС (цвете). Европейската <b>Зелена сделка</b> поставя цел ЕС да е климатично неутрален до 2050 г.</p>`,
['Три стълба: икономика, общество, природа.','Кръгова икономика: намали, използвай повторно, поправи, рециклирай.']),
L('3.2','Въздействие на бизнеса върху околната среда',2,`
<p><b>Как бизнесът замърсява:</b> емисии във въздуха, отпадъчни води, отпадъци, шум, изсичане на гори, голямо потребление на енергия и вода.</p>
<p><b>Нормативни изисквания</b> в България: Закон за опазване на околната среда, Закон за управление на отпадъците, Закон за водите, Закон за чистотата на атмосферния въздух. Контрол упражняват Министерството на околната среда и водите (МОСВ) и регионалните инспекции (РИОСВ).</p>
<p><b>Екологична оценка на проекти:</b></p>
<ul><li><b>ОВОС</b> (оценка на въздействието върху околната среда) – задължителна за по-големи проекти като заводи, пътища и мини.</li><li><b>ЕО</b> (екологична оценка) – за планове и програми.</li><li>За проекти близо до защитени зони по <b>Натура 2000</b> се прави оценка за съвместимост.</li></ul>
<p><b>Зелени умения в офиса:</b> пестене на енергия и хартия, електронни документи, рециклиране, избор на доставчици с екосертификати, споделено пътуване или градски транспорт.</p>
<div class="ex">Пример от региона: Родопите имат минна история (оловно-цинкови руди). Опазването на реките и възстановяването на терените е пряк пример за отговорност на бизнеса към природата.</div>`,
['ОВОС е задължителна за големи проекти.','Контролът се осъществява от МОСВ и РИОСВ.'])
],
quiz:[
Q('Кои са трите стълба на устойчивото развитие?',['Земя, труд, капитал','Икономически, социален, екологичен','Планиране, контрол, отчет','Цена, продукт, реклама'],1,'Устойчивото развитие балансира икономиката, обществото и природата.'),

M({
id:'pravo', sec:'А2', code:'А2.4', title:'Правна грамотност за бизнеса и администрацията', short:'Правна грамотност',
t:4, p:0, days:['2026-11-17'],
intro:'Как са подредени законите в България и какво трябва да знаем за трудовия договор.',
lessons:[
L('4.1','Правна норма, йерархия на актовете, отрасли на правото',2,`
<p><b>Правната норма</b> е общозадължително правило за поведение, установено или признато от държавата и гарантирано с принуда (санкция).</p>
<p><b>Източници на правото:</b> Конституция, международни договори, закони, подзаконови актове, правото на ЕС.</p>
<p><b>Йерархия на нормативните актове</b> (по-долният не може да противоречи на по-горния):</p>
<ol><li><b>Конституция</b> на Република България</li><li>Ратифицирани <b>международни договори</b></li><li><b>Кодекси и закони</b> (приемат се от Народното събрание)</li><li><b>Постановления</b> на Министерския съвет</li><li><b>Правилници, наредби, инструкции</b></li><li>Актове на общинските съвети (наредби на общината)</li></ol>
<p>Регламентите на ЕС се прилагат пряко и имат предимство пред противоречащите им национални норми. Законите се обнародват в <b>„Държавен вестник“</b>.</p>
<p><b>Отрасли на правото:</b></p>
<ul><li><b>Административно</b> – отношения с държавни органи (издаване на разрешения, глоби).</li><li><b>Трудово</b> – отношения работодател–работник (Кодекс на труда).</li><li><b>Гражданско</b> – собственост, договори, наследство между равнопоставени лица.</li><li><b>Търговско</b> – търговци и сделки (Търговски закон).</li></ul>`,
['Конституцията е най-високият акт.','Законите се обнародват в „Държавен вестник“.']),
L('4.2','Трудов договор',2,`
<p><b>Трудовият договор</b> се сключва в <b>писмена форма</b> преди постъпване на работа. Работодателят уведомява <b>НАП</b> в 3-дневен срок от сключването, като подава уведомлението преди работникът да започне.</p>
<p><b>Съдържание:</b> страни, място на работа, длъжност и характер на работата, дата на сключване и начало, срок, размер на платения отпуск, срок на предизвестието, основно и допълнителни възнаграждения, продължителност на работното време.</p>
<p><b>Видове:</b> безсрочен; срочен (за определен срок или за определена работа); със срок за изпитване (до 6 месеца); за заместване на отсъстващ служител; за допълнителен труд; за краткотрайна сезонна работа.</p>
<p><b>Задължения на работодателя:</b> да осигури работа, безопасни условия, заплата навреме и осигуровки. <b>Задължения на работника:</b> да работи добросъвестно, да спазва работното време и дисциплината, да пази имуществото и поверителната информация.</p>
<p><b>Работно време:</b> нормално 8 часа на ден и 40 часа седмично. <b>Платен годишен отпуск:</b> не по-малко от <b>20 работни дни</b>.</p>
<p><b>Прекратяване:</b> по взаимно съгласие; с предизвестие от работника или от работодателя (обикновено 30 дни при безсрочен договор, ако не е уговорено друго, но не повече от 3 месеца); без предизвестие в определени от закона случаи; с дисциплинарно уволнение. При прекратяването се издава заповед и се вписва в трудовата книжка.</p>`,
['Договорът е писмен и се регистрира в НАП преди започване на работа.','8 ч на ден / 40 ч седмично; минимум 20 дни платен отпуск.'])
],

M({
id:'obikon', sec:'А2', code:'А2.5', title:'Обща икономическа теория, икономическо поведение и вземане на решения', short:'Икономическо поведение',
t:4, p:0, days:['2026-11-17'],
intro:'Как хората и фирмите вземат решения при ограничени ресурси, как се формира печалбата и какво влияе на потребителите.',
lessons:[
L('5.1','Разумни решения при ограничени ресурси',1,`
<p>Понеже ресурсите са ограничени, всеки избор има цена. <b>Алтернативната цена</b> е стойността на най-добрата възможност, от която се отказваме.</p>
<div class="ex">Ако вечерта учите за курса вместо да работите 3 часа, алтернативната цена е изгубеното заплащане за тези 3 часа.</div>
<p><b>Разумното решение</b> сравнява допълнителната полза с допълнителния разход. Действието си струва, когато ползата е по-голяма.</p>
<p><b>Трите основни икономически въпроса:</b> <b>Какво</b> да се произвежда? <b>Как</b> да се произвежда? <b>За кого</b> да се произвежда?</p>`,
['Всеки избор има алтернативна цена.','Разумно е да действаме, когато ползата е по-голяма от разхода.']),
L('5.2','Пазарни структури и еластичност',1,`
<ul><li><b>Съвършена конкуренция</b> – много продавачи на еднакъв продукт (зърно на борсата).</li><li><b>Монополистична конкуренция</b> – много продавачи на различаващи се продукти (кафенета, фризьори).</li><li><b>Олигопол</b> – няколко големи фирми (мобилни оператори, горива).</li><li><b>Монопол</b> – един продавач (водоснабдяване в даден град).</li></ul>
<p><b>Ценова еластичност на търсенето</b> показва колко силно се променя търсеното количество, когато се промени цената.</p>
<p class="formula">Еластичност = % промяна на количеството ÷ % промяна на цената</p>
<ul><li><b>Еластично търсене</b> (&gt;1) – клиентите реагират силно (дрехи от марка, ресторанти).</li><li><b>Нееластично</b> (&lt;1) – купуваме почти същото количество (хляб, лекарства, ток).</li></ul>`,
['Олигопол = няколко големи фирми.','Стоките от първа необходимост имат нееластично търсене.']),
L('5.3','Приходи, разходи и печалба',1,`
<p class="formula">Печалба = Приходи − Разходи</p>
<ul><li><b>Постоянни разходи</b> – не зависят от обема (наем, заплати на администрацията, застраховка).</li><li><b>Променливи разходи</b> – растат с обема (суровини, опаковки, транспорт на стоката).</li><li><b>Общи разходи</b> = постоянни + променливи.</li></ul>
<p><b>Точка на безубезност</b> – количеството, при което приходите покриват всички разходи и печалбата е нула.</p>
<p class="formula">Точка на безубезност (бр.) = Постоянни разходи ÷ (Цена − Променлив разход за брой)</p>
<div class="ex">Пекарна: наемът и другите постоянни разходи са 1 200 € на месец. Една баница се продава за 2,50 €, а продуктите за нея струват 1,00 €. 1 200 ÷ (2,50 − 1,00) = <b>800 баници</b> на месец, за да няма загуба.</div>`,
['Постоянните разходи не зависят от обема.','Под точката на безубезност има загуба.']),
L('5.4','Пределна полезност и потребителски решения',1,`
<p><b>Полезност</b> е удовлетворението, което получаваме от един продукт. <b>Пределна полезност</b> е допълнителното удовлетворение от още една единица.</p>
<p><b>Закон за намаляващата пределна полезност:</b> всяка следваща единица носи по-малко удовлетворение. Първата чаша вода при жажда е безценна, а петата почти не ни трябва.</p>
<p>Потребителят разпределя своя <b>разполагаем доход</b> (доходът след данъците) така, че да получи най-голямо общо удовлетворение. Когато доходът се увеличи, купуваме повече и по-качествени стоки. Когато намалее, се насочваме към необходимото и по-евтиното.</p>
<p>Това обяснява отстъпките от типа „втори продукт на половин цена“: те компенсират по-малката полезност на втората бройка.</p>`,
['Всяка следваща бройка носи по-малко удовлетворение.','Разполагаемият доход определя потребителските решения.'])
],

Q('Какво е алтернативна цена?',['Цената с отстъпка','Стойността на най-добрата пропусната възможност','Цената в друга валута','Себестойността'],1,'Тя показва какво губим, като изберем дадена възможност.'),
Q('Наемът на офиса е…',['променлив разход','постоянен разход','приход','печалба'],1,'Наемът не зависи от количеството продадени стоки.'),
Q('Постоянни разходи 600 €, цена 5 €, променлив разход 2 € на бройка. Точката на безубезност е…',['100 бр.','120 бр.','200 бр.','300 бр.'],2,'600 ÷ (5 − 2) = 200 броя.'),
Q('Пазарът на мобилни услуги с 3 оператора е…',['монопол','олигопол','съвършена конкуренция','монополистична конкуренция'],1,'Няколко големи фирми означава олигопол.'),
Q('Търсенето на хляб обикновено е…',['силно еластично','нееластично','нулево','отрицателно'],1,'Хлябът е стока от първа необходимост.')

ex:[X('Изчислете безубезност','Шивашко ателие: постоянни разходи 2 400 € на месец, цена на риза 30 €, материали за риза 14 €. Колко ризи трябва да продаде? Каква е печалбата при 200 ризи?','2 400 ÷ 16 = 150 ризи. При 200 ризи: приходи 6 000 €, разходи 2 400 + 2 800 = 5 200 €, печалба 800 €.')],

notes:'Денят е общ с „Правна грамотност“. За изчисленията позволете калкулатор на телефона.'

M({
id:'menid', sec:'А2', code:'А2.6', title:'Основи на мениджмънта', short:'Мениджмънт',
t:4, p:0, days:['2026-11-18'],
intro:'Какво прави един ръководител, как се взимат управленски решения и как средата влияе на организацията.',
lessons:[
L('6.1','Същност на мениджмънта. Управленски функции',2,`
<p><b>Мениджмънтът</b> е процесът, чрез който се постигат целите на организацията с помощта на хора и ресурси.</p>
<p><b>Елементи на управленската система:</b> <b>субект</b> (кой управлява – ръководители), <b>обект</b> (какво се управлява – хора, процеси, ресурси), <b>цели</b>, <b>връзки</b> (команди и обратна информация).</p>
<p><b>Четирите основни функции:</b></p>
<ol><li><b>Планиране</b> – поставяне на цели и начини за постигането им.</li><li><b>Организиране</b> – разпределение на задачи, хора и ресурси. Структурата се изобразява с органиграма.</li><li><b>Ръководене (мотивиране)</b> – насочване и мотивиране на хората, комуникация.</li><li><b>Контрол</b> – сравняване на резултатите с плана и коригиране.</li></ol>
<p><b>SMART цели:</b> конкретни (Specific), измерими (Measurable), постижими (Achievable), реалистични (Relevant), с краен срок (Time-bound).</p>
<div class="ex">Не е SMART: „Да подобрим архива.“ SMART: „До 15 декември да опишем и подредим всички дела от 2025 г. в електронния регистър.“</div>`,
['Функции: планиране, организиране, ръководене, контрол.','Целите трябва да са SMART.']),
L('6.2','Организационна среда. Управленски решения',2,`
<p><b>Вътрешна среда:</b> цели, структура, хора, технологии, финанси, фирмена култура.</p>
<p><b>Външна среда:</b> клиенти, доставчици, конкуренти, държава, икономика, технологии, общество, природа. За анализа ѝ се използва <b>PEST</b> (политически, икономически, социални и технологични фактори).</p>
<p><b>SWOT анализ</b> свързва двете: силни страни (S) и слабости (W) идват отвътре, а възможности (O) и заплахи (T) – отвън.</p>
<p><b>Стъпки на управленското решение:</b> 1) определяне на проблема; 2) събиране на информация; 3) варианти; 4) оценка; 5) избор; 6) изпълнение; 7) контрол и обратна връзка.</p>
<p><b>Методи:</b> индивидуално или групово решение, мозъчна атака, анализ „разходи – ползи“, експертна оценка.</p>
<p><b>Обратната връзка</b> показва дали решението работи. Без нея ръководителят не знае какво да коригира.</p>`,
['SWOT: силни, слаби (вътре); възможности, заплахи (вън).','Решението завършва с контрол и обратна връзка.'])
],
quiz:[
Q('Коя НЕ е основна управленска функция?',['Планиране','Контрол','Рекламиране','Организиране'],2,'Функциите са планиране, организиране, ръководене и контрол.'),
Q('В SWOT анализа „заплахите“ идват от…',['вътрешната среда','външната среда','счетоводството','служителите'],1,'Възможностите и заплахите са външни фактори.'),
Q('Буквата „M“ в SMART означава…',['мотивирана','измерима','масова','модерна'],1,'Measurable – измерима.'),
Q('С какво се изобразява структурата на организацията?',['Органиграма','Баланс','Фактура','Диаграма на Гант'],0,'Органиграмата показва звената и подчинеността.')
],

M({
id:'mark', sec:'А2', code:'А2.7', title:'Основи на маркетинга', short:'Маркетинг',
t:4, p:0, days:['2026-11-18'],
intro:'Какво е маркетинг, как работи маркетинг миксът, какъв е жизненият цикъл на продукта и как се проучват клиентите.',
lessons:[
L('7.1','Същност, роля и функции на маркетинга',1,`
<p><b>Маркетингът</b> е дейността по откриване на нуждите на клиентите и задоволяването им с печалба. Той е много повече от реклама.</p>
<p><b>Функции:</b> проучване на пазара, разработване на продукт, ценообразуване, разпространение, комуникация (реклама и промоции), обслужване след продажбата.</p>
<p><b>Сегментиране</b> е разделяне на пазара на групи клиенти със сходни нужди: по възраст, доход, място или поведение. <b>Целевият пазар</b> е групата, към която се насочваме.</p>`,
['Маркетингът започва от нуждите на клиента.']),
L('7.2','Маркетинг микс. Жизнен цикъл на продукта',2,`
<p><b>Маркетинг микс „4P“:</b></p>
<ul><li><b>Продукт</b> (Product) – качество, дизайн, марка, опаковка, гаранция.</li><li><b>Цена</b> (Price) – ценова стратегия, отстъпки, условия на плащане.</li><li><b>Място</b> (Place) – канали на дистрибуция: магазин, онлайн, търговци на едро.</li><li><b>Промоция</b> (Promotion) – реклама, социални мрежи, връзки с обществеността, промоции.</li></ul>
<p><b>Жизнен цикъл на продукта:</b></p>
<ol><li><b>Въвеждане</b> – малки продажби, високи разходи за реклама.</li><li><b>Растеж</b> – продажбите растат бързо и се появяват конкуренти.</li><li><b>Зрялост</b> – продажбите са най-високи и се стабилизират, конкуренцията е силна.</li><li><b>Упадък</b> – продажбите падат. Продуктът се обновява или се спира.</li></ol>
<div class="ex">CD плейърите са в упадък. Сгъваемите смартфони са в растеж. Обикновеното мляко е в зрялост.</div>`,
['4P: продукт, цена, място, промоция.','Етапи: въвеждане, растеж, зрялост, упадък.']),
L('7.3','Проучване на потребители',1,`
<p><b>Защо проучваме?</b> За да разберем кой купува, какво иска, колко е готов да плати и откъде пазарува.</p>
<p><b>Методи:</b></p>
<ul><li><b>Анкета</b> – въпросник на хартия или онлайн (например Google Forms).</li><li><b>Интервю</b> – разговор с клиенти.</li><li><b>Наблюдение</b> – как клиентите се държат в магазина.</li><li><b>Фокус група</b> – дискусия с 6–10 души.</li><li><b>Вторична информация</b> – НСИ, отраслови доклади, сайтове на конкуренти.</li></ul>
<p><b>Добрата анкета</b> е кратка (до 10 въпроса), с ясни въпроси без подвеждане и анонимна, когато е възможно. Затворените въпроси са по-лесни за обобщаване.</p>`,
['Анкета, интервю, наблюдение, фокус група.'])
],

M({
id:'fin', sec:'А2', code:'А2.8', title:'Основи на финансите и финансовото управление', short:'Финанси',
t:4, p:0, days:['2026-11-19'],
intro:'Пари, лихви и публични финанси: откъде държавата събира пари и за какво ги харчи.',
lessons:[
L('8.1','Пари и парична система',1,`
<p><b>Парите</b> са общоприето средство за размяна.</p>
<p><b>Функции на парите:</b> мярка на стойността (цените), средство за обращение (купуване), средство за плащане (заплати, данъци), средство за натрупване (спестявания), световни пари.</p>
<p><b>Форми:</b> монети и банкноти, безкасови (по банкова сметка), електронни (карти, мобилни плащания).</p>
<p><b>Паричната система</b> е устройството на паричното обращение в една държава. От <b>1 януари 2026 г.</b> официалната валута на България е <b>еврото</b>, а паричната политика се провежда от Европейската централна банка (ЕЦБ) заедно с БНБ като част от Еврозоната. Фиксираният курс на превръщане е <b>1 € = 1,95583 лв.</b></p>`,
['От 1.01.2026 г. валутата на България е еврото.','1 € = 1,95583 лв.']),
L('8.2','Лихва – същност, видове, фактори',1,`
<p><b>Лихвата</b> е цената за ползване на чужди пари. Кредитополучателят плаща лихва, а вложителят получава лихва.</p>
<p><b>Проста лихва</b> се начислява само върху главницата.</p>
<p class="formula">Лихва = Главница × Годишен лихвен % × Години</p>
<p><b>Сложна лихва</b> („лихва върху лихвата“) се начислява и върху натрупаната лихва.</p>
<p class="formula">Крайна сума = Главница × (1 + %)<sup>години</sup></p>
<div class="ex">1 000 € депозит при 3% годишно за 2 години. Проста лихва: 1 000 × 0,03 × 2 = 60 €. Сложна: 1 000 × 1,03² = 1 060,90 €, т.е. 60,90 € лихва.</div>
<p><b>Видове:</b> фиксирана и плаваща лихва, номинална и реална (след приспадане на инфлацията), а при кредитите – <b>ГПР</b> (годишен процент на разходите, който включва и таксите).</p>
<p><b>Какво влияе на лихвения процент:</b> лихвите на ЕЦБ, инфлацията, рискът на кредитополучателя, срокът, търсенето на кредити и конкуренцията между банките.</p>`,
['Сложната лихва се начислява и върху натрупаната лихва.','Кредитите се сравняват по ГПР.']),
L('8.3','Публични финанси – приходи и разходи',2,`
<p><b>Публичните финанси</b> са парите, които държавата и общините събират и харчат за обществени нужди. Те се планират в <b>бюджет</b>, който за държавата се приема със закон от Народното събрание.</p>
<p><b>Бюджетна система:</b> държавен бюджет, бюджети на общините, бюджет на Държавното обществено осигуряване (НОИ), бюджет на НЗОК.</p>
<p><b>Основни приходи:</b></p>
<ul><li><b>Данъци:</b> ДДС (основна ставка 20%), данък върху доходите на физическите лица (10%), корпоративен данък (10%), акцизи, местни данъци (недвижими имоти, превозни средства);</li><li><b>осигурителни вноски</b>;</li><li><b>такси</b> (за услуги, битови отпадъци);</li><li>неданъчни приходи, средства от ЕС.</li></ul>
<p><b>Публични разходи:</b> пенсии и социални плащания, здравеопазване, образование, отбрана и сигурност, инфраструктура, администрация, лихви по държавния дълг.</p>
<p><b>Бюджетен дефицит</b> имаме, когато разходите са по-големи от приходите. Обратното е излишък. Дефицитът се финансира с дълг.</p>`,
['Основните приходи са данъците и осигуровките.','ДДС 20%, ДДФЛ 10%, корпоративен данък 10%.'])
],
quiz:[
Q('Коя е официалната валута на България от 2026 г.?',['Лев','Евро','Долар','Швейцарски франк'],1,'България е в Еврозоната от 1 януари 2026 г.'),
Q('500 € при 4% проста годишна лихва за 3 години носят лихва…',['20 €','40 €','60 €','62,43 €'],2,'500 × 0,04 × 3 = 60 €.'),
Q('Основната ставка на ДДС в България е…',['10%','9%','20%','25%'],2,'Основната ставка е 20%.'),
Q('Кога има бюджетен дефицит?',['Когато приходите са повече от разходите','Когато разходите са повече от приходите','Когато няма данъци','Когато има инфлация'],1,'Дефицитът е недостиг на приходи.'),
Q('Кой показател включва лихвата и таксите по кредит?',['ДДС','ГПР','БВП','ОЛП'],1,'Годишният процент на разходите е общата цена на кредита.')
],
ex:[X('Сравнете два кредита','Кредит А: 5 000 € за 3 г., ГПР 9%. Кредит Б: 5 000 € за 3 г., лихва 7,5%, но ГПР 10,2% заради такси. Кой е по-изгоден и защо?','Кредит А, защото ГПР отразява общата цена с таксите. Ниската лихва при Б е подвеждаща.'),
X('Бюджет на общината','Разгледайте бюджета на Община Рудозем на сайта на общината. Посочете 3 основни приходни и 3 разходни пера.','Отговорите зависят от реалния бюджет: напр. приходи – местни данъци, такса битови отпадъци, трансфери от държавата; разходи – образование, социални дейности, благоустройство.')],
gl:[G('Главница','Сумата, която се взима на заем или се влага.'),G('ГПР','Годишен процент на разходите по кредит, включително таксите.'),G('Бюджетен дефицит','Превишение на разходите над приходите.'),G('ЕЦБ','Европейската централна банка.'),G('ДДС','Данък добавена стойност.')],
plan:['Урок 8.1, кратка история от лев към евро','Урок 8.2 с изчисления','Урок 8.3 и бюджета на общината','Тест'],
notes:'Денят е общ със „Счетоводна отчетност – теория“. Проверете актуалните ставки преди урока.'
});

M({
id:'schet', sec:'А2', code:'А2.9', title:'Основи на счетоводната отчетност', short:'Счетоводна отчетност',
t:4, p:12, days:['2026-11-19','2026-11-20','2026-11-23'],
intro:'Принципи на счетоводството, двойното записване, счетоводните документи и инвентаризацията.',
lessons:[
L('9.1','Основни принципи на счетоводната дейност',1,`
<p>Счетоводството в България се урежда от <b>Закона за счетоводството</b> и счетоводните стандарти. То отразява имуществото на предприятието и стопанските операции.</p>
<p><b>Основни счетоводни принципи:</b></p>
<ul><li><b>Действащо предприятие</b> – приема се, че фирмата ще продължи да работи.</li><li><b>Предпазливост</b> – рисковете и загубите се отчитат, а неосигурените печалби не се отчитат.</li><li><b>Текущо начисляване</b> – приходите и разходите се отчитат, когато възникнат, а не когато се платят.</li><li><b>Съпоставимост на приходи и разходи</b>.</li><li><b>Предимство на съдържанието пред формата</b>.</li><li><b>Последователност</b> – методите не се сменят без причина.</li><li><b>Независимост на отчетните периоди</b>.</li><li><b>Стойностна оценка</b> по цена на придобиване.</li><li><b>Некомпенсиране</b> – активите и пасивите не се прихващат.</li></ul>
<p><b>Счетоводно уравнение:</b></p>
<p class="formula">Активи = Собствен капитал + Пасиви (задължения)</p>`,
['Активи = Капитал + Пасиви.','Текущо начисляване: отчитаме, когато възникне, не когато се плати.']),
L('9.2','Отчитане на стопански операции',1,`
<p><b>Стопанска операция</b> е всяко действие, което променя имуществото или източниците му: покупка, продажба, плащане, заплата.</p>
<p><b>Двойно записване:</b> всяка операция се записва в <b>две</b> сметки с еднаква сума – в <b>дебита</b> на едната и в <b>кредита</b> на другата.</p>
<ul><li><b>Активните сметки</b> (каса, банка, материали, клиенти) се увеличават в дебит и намаляват в кредит.</li><li><b>Пасивните сметки</b> (капитал, доставчици, задължения) се увеличават в кредит и намаляват в дебит.</li></ul>
<div class="ex">Изтеглени са 500 € от банковата сметка в касата. <b>Дт Каса 500 / Кт Разплащателна сметка 500</b>. Касата се увеличава, а банката намалява.</div>
<div class="ex">Купени са материали за 300 € с плащане по-късно. <b>Дт Материали 300 / Кт Доставчици 300</b>.</div>
<p><b>Видове операции:</b> само в актива, само в пасива, увеличаване на актив и пасив, намаляване на актив и пасив. Балансът винаги остава равен.</p>`,
['Всяка операция се записва два пъти: в дебит и в кредит.','Активните сметки растат в дебит, пасивните – в кредит.']),
L('9.3','Първични и вторични документи. Инвентаризация и брак',2,`
<p>Всяка операция трябва да има <b>счетоводен документ</b>.</p>
<p><b>Първични документи</b> се съставят при самата операция: фактура, касов бон, приходен и разходен касов ордер, платежно нареждане, приемо-предавателен протокол, складова разписка, искане за материали.</p>
<p><b>Вторични документи</b> се съставят въз основа на първичните: мемориален ордер, счетоводна справка, ведомост за заплати.</p>
<p><b>Задължителни реквизити:</b> наименование и номер на документа, дата, данни за издателя и получателя (ЕИК), предмет и стойност на операцията, подписи.</p>
<p><b>Инвентаризация</b> е проверка на реалното наличие на активите и сравняването му със счетоводните данни. Прави се поне веднъж годишно към края на годината, както и при смяна на материалноотговорно лице, кражба или бедствие.</p>
<ol><li><b>Заповед</b> на ръководителя за назначаване на инвентаризационна комисия.</li><li>Преброяване, измерване и претегляне, вписване в <b>инвентаризационен опис</b>.</li><li><b>Сравнителна ведомост</b> – сравнение с данните от счетоводството, установяване на липси и излишъци.</li><li><b>Протокол</b> с резултатите и предложения.</li></ol>
<p><b>Бракуване</b> е изваждане от употреба на активи, които са повредени, остарели или с изтекъл срок. Комисия съставя <b>протокол за брак</b>, който се утвърждава от ръководителя, и описва причината и начина на унищожаване.</p>`,
['Фактурата е първичен документ, мемориалният ордер – вторичен.','Инвентаризация: заповед → опис → сравнителна ведомост → протокол.'])
],
quiz:[
Q('Кое е счетоводното уравнение?',['Приходи = Разходи','Активи = Капитал + Пасиви','Печалба = Активи − Капитал','Каса = Банка'],1,'Двете страни на баланса винаги са равни.'),
Q('Изтеглени 200 € от банката в касата. Записването е…',['Дт Банка / Кт Каса','Дт Каса / Кт Банка','Дт Каса / Кт Капитал','Дт Доставчици / Кт Каса'],1,'Касата (актив) се увеличава в дебит, банката намалява в кредит.'),
Q('Кой документ е първичен?',['Мемориален ордер','Фактура','Счетоводна справка','Оборотна ведомост'],1,'Фактурата се съставя при самата сделка.'),
Q('Къде се сравняват резултатите от преброяването със счетоводните данни?',['В инвентаризационния опис','В сравнителната ведомост','В заповедта','В баланса'],1,'Сравнителната ведомост показва липсите и излишъците.'),
Q('Принципът „текущо начисляване“ означава…',['отчитаме при плащане','отчитаме при възникване','отчитаме в края на годината','не отчитаме разходи'],1,'Операциите се отчитат, когато възникнат.')
],
ex:[
X('Попълнете фактура','Попълнете фактура (на бланка или в Excel) за продажба на 10 кутии хартия А4 по 4,50 € без ДДС. Изчислете ДДС и общата сума.','Данъчна основа 45,00 €; ДДС 20% = 9,00 €; общо 54,00 €. Задължителни реквизити: номер (10 цифри), дата, данни за доставчика и получателя с ЕИК/ДДС номер, описание, количество, цена, основа, ставка, ДДС, сума, начин на плащане.'),
X('Приходен и разходен касов ордер','Съставете ПКО за внесени в касата 150 € от клиент и РКО за 40 € за куриер.','ПКО: дата, от кого, основание „плащане по фактура №…“, сума с цифри и думи, подписи на касиер и вносител. РКО: на кого, основание „куриерски услуги“, сума, подписи на касиер, получател и ръководител.'),
X('Счетоводни записвания','Запишете: 1) покупка на материали 800 € по банка; 2) продажба на стоки на клиент 1 200 € с плащане по-късно; 3) клиентът плаща 1 200 € по банка.','1) Дт Материали / Кт Разплащателна сметка 800; 2) Дт Клиенти / Кт Приходи от продажби 1 200; 3) Дт Разплащателна сметка / Кт Клиенти 1 200.'),
X('Инвентаризация на класната стая','В комисия от трима преброите столове, маси, компютри и консумативи. Попълнете опис и сравнителна ведомост с данните, които ще ви даде преподавателят.','Оценява се правилното попълване: наименование, мярка, количество по опис и по счетоводство, разлика (+ излишък / − липса), подписи на комисията.'),
X('Протокол за брак','Съставете протокол за брак на 2 стари принтера и 1 счупен стол.','Комисия, дата, основание (заповед №), описание на активите, инвентарен номер, причина (неремонтируем, физически износен), предложение за предаване на пункт за ИУЕЕО, подписи и утвърждаване.')
],
gl:[G('Дебит / Кредит','Лявата / дясната страна на счетоводната сметка.'),G('Двойно записване','Всяка операция се записва едновременно в две сметки.'),G('Първичен документ','Документ, съставен при извършване на операцията.'),G('ПКО / РКО','Приходен / разходен касов ордер.'),G('Инвентаризация','Проверка на реалното наличие на активите.'),G('ЕИК','Единен идентификационен код на фирма.')],
plan:['19.11 (4 ч теория): уроци 9.1–9.3','20.11 (8 ч практика): фактури, ПКО, РКО, двойно записване','23.11 (4 ч практика): инвентаризация на класната стая и протокол за брак','Тест'],
notes:'Подгответе бланки на фактура, ПКО, РКО, инвентаризационен опис. Сумите са в евро.'
});

M({
id:'stat', sec:'А2', code:'А2.10', title:'Основи на бизнес статистиката и визуализация на данни', short:'Статистика и визуализация',
t:4, p:12, days:['2026-11-23','2026-11-24','2026-11-25'],
intro:'Как да събираме, обобщаваме и показваме данни с таблици и графики, и как да измерваме развитието във времето.',
lessons:[
L('10.1','Основни понятия. Статистическо изследване. Средни величини',1,`
<p><b>Статистиката</b> събира, обработва и анализира данни за масови явления. В България официалната статистика се води от <b>Националния статистически институт (НСИ)</b>.</p>
<p><b>Понятия:</b> <b>съвкупност</b> (всички изследвани единици, например служителите на фирма), <b>единица</b> (един служител), <b>признак</b> (възраст, заплата, пол), <b>стойност на признака</b>.</p>
<p><b>Етапи на изследването:</b> 1) наблюдение (събиране на данни); 2) групиране и обработка; 3) анализ и изводи.</p>
<p><b>Средни величини:</b></p>
<ul><li><b>Средна аритметична</b> – сбор от стойностите ÷ броя им.</li><li><b>Претеглена средна</b> – когато стойностите се повтарят различен брой пъти.</li><li><b>Медиана</b> – стойността по средата на подредения ред. Не се влияе от крайни стойности.</li><li><b>Мода</b> – най-често срещаната стойност.</li></ul>
<div class="ex">Заплати: 900, 950, 1 000, 1 050, 4 000 €. Средна аритметична = 1 580 €, а медианата = 1 000 €. Медианата описва „типичната“ заплата по-добре, защото една много висока заплата не я изкривява.</div>`,
['Средна, медиана, мода.','Медианата не се влияе от крайни стойности.']),
L('10.2','Таблично и графично представяне',1,`
<p><b>Статистическата таблица</b> има заглавие (какво, къде, кога), заглавия на редове и колони, мерни единици, източник и, при нужда, ред „Общо“.</p>
<p><b>Кога каква графика да изберем:</b></p>
<ul><li><b>Стълбовидна (колонна)</b> – сравнение между категории (продажби по продукти).</li><li><b>Линейна</b> – развитие във времето (продажби по месеци).</li><li><b>Кръгова</b> – структура и дялове от цялото (до 5–6 части, сумата е 100%).</li><li><b>Точкова</b> – връзка между два признака (реклама и продажби).</li></ul>
<p><b>Правила:</b> ясно заглавие, надписи на осите с мерни единици, легенда при повече серии, скалата на колонните графики започва от нула, без излишни ефекти и 3D.</p>`,
['Линейна графика – за време; кръгова – за дялове; колонна – за сравнение.']),
L('10.3','Статистическо изследване на развитието',1,`
<p><b>Динамичен ред</b> е поредица от стойности на показател във времето (по месеци, години).</p>
<p><b>Показатели:</b></p>
<ul><li><b>Абсолютен прираст</b> = текущо ниво − предходно (или базисно) ниво.</li><li><b>Темп на растеж</b> = текущо ÷ предходно × 100%.</li><li><b>Темп на прираст</b> = темп на растеж − 100%.</li></ul>
<p><b>Верижните</b> показатели сравняват всеки период с предходния. <b>Базисните</b> сравняват всеки период с един постоянен (първи) период.</p>
<div class="ex">Продажби: 2024 г. – 40 000 €, 2025 г. – 46 000 €. Абсолютен прираст = 6 000 €. Темп на растеж = 115%. Темп на прираст = +15%.</div>`,
['Темп на прираст = темп на растеж − 100%.','Верижни – спрямо предходния период; базисни – спрямо постоянна база.']),
L('10.4','Извадково изследване',1,`
<p>Когато съвкупността е голяма, изследваме само част от нея – <b>извадка</b>, и правим изводи за цялото.</p>
<p>Извадката трябва да е <b>представителна (репрезентативна)</b>, т.е. да прилича по структура на цялата съвкупност.</p>
<p><b>Методи на подбор:</b></p>
<ul><li><b>Прост случаен</b> – всеки има еднакъв шанс (жребий, случайни числа).</li><li><b>Систематичен</b> – всеки k-ти от списъка (всеки 10-и клиент).</li><li><b>Стратифициран (разслоен)</b> – съвкупността се разделя на групи (по възраст, населено място) и от всяка се избира пропорционално.</li><li><b>Гнездови</b> – избират се цели групи (цели класове, села).</li></ul>
<p>Винаги има <b>грешка на извадката</b>. Тя намалява, когато извадката е по-голяма и по-добре подбрана.</p>`,
['Извадката трябва да е представителна.','По-голямата извадка дава по-малка грешка.'])
],

M({
id:'ofis', sec:'А3', code:'А3.1', title:'Офис обслужване и делова комуникация', short:'Офис обслужване',
t:8, p:0, days:['2026-11-25','2026-11-26'],
intro:'Професионална етика, делови протокол, фирмена култура и посрещане на посетители.',
lessons:[
L('1.1','Професионална етика и конфиденциалност',1,`
<p><b>Професионалната етика</b> е сбор от ценности и норми за поведение в работата. Повечето организации ги записват в <b>Етичен кодекс</b>.</p>
<p><b>Основни ценности:</b> честност, отговорност, уважение, безпристрастност, лоялност към организацията, професионализъм, отчетност.</p>
<p><b>Конфиденциалност</b> означава да не разгласявате служебна информация: данни за клиенти, договори, заплати, вътрешни решения.</p>
<ul><li>Не обсъждайте служебни въпроси на публични места и в социалните мрежи.</li><li>Заключвайте екрана, когато ставате от бюрото (<b>Win + L</b>).</li><li>Унищожавайте ненужните документи с шредер.</li><li>При съмнение питайте ръководителя.</li></ul>
<p><b>Конфликт на интереси</b> възниква, когато личният ви интерес може да повлияе на служебно решение (например роднина участва в търг). Той трябва да се декларира.</p>`,
['Конфиденциалността важи и след работно време.','Конфликтът на интереси се декларира.']),
L('1.2','Делови протокол. Принципи на бизнес комуникацията',2,`
<p><b>Деловият протокол</b> е сбор от правила за официално общуване.</p>
<ul><li><b>Представяне:</b> по-младият се представя на по-възрастния, а подчиненият – на ръководителя. Домакинът представя гостите.</li><li><b>Ръкостискане:</b> кратко и уверено, с поглед в очите. Инициативата е на по-високопоставения.</li><li><b>Обръщение:</b> „г-н / г-жа“ с фамилия или с длъжност („Уважаеми господин Кмете“).</li><li><b>Визитки:</b> подават се с текста към получателя. Прочитат се, не се прибират веднага.</li><li><b>Точност:</b> закъснението е неуважение. Ако закъснявате, предупредете.</li><li><b>Облекло:</b> според правилата на организацията. Обикновено е делово-класическо.</li></ul>
<p><b>Принципи на бизнес комуникацията (7К):</b> ясно, кратко, конкретно, коректно, учтиво, пълно, последователно.</p>
<p><b>Комуникация с външни контрагенти</b> (клиенти, доставчици, институции): официален тон, писмено потвърждение на договореностите, срокове и отговорни лица.</p>`,
['Подчиненият се представя на ръководителя.','Ясно, кратко, конкретно, коректно, учтиво.']),
L('1.3','Фирмена култура – същност и роля',1,`
<p><b>Фирмената (организационна) култура</b> е съвкупност от ценности, вярвания, традиции и неписани правила, които определят „как правим нещата тук“.</p>
<p><b>Защо е важна:</b></p>
<ul><li>обединява служителите около общи цели;</li><li>улеснява адаптацията на новите служители;</li><li>влияе на мотивацията и задържането на хората;</li><li>изгражда образа на фирмата пред клиентите.</li></ul>
<p>Културата може да е <b>силна</b> (споделена от всички) или <b>слаба</b>. Може да е <b>ориентирана към хората</b> или <b>към задачите</b>, йерархична или екипна.</p>`,
['Фирмената култура е „как правим нещата тук“.']),
L('1.4','Елементи, функции и утвърждаване на фирмената култура',2,`
<p><b>Видими елементи:</b> лого, цветове, облекло, обзавеждане, ритуали (празници, награди), език и изрази.</p>
<p><b>Невидими елементи:</b> ценности, убеждения, нагласи и неписани правила.</p>
<p><b>Функции:</b> идентичност, стабилност, контрол на поведението, мотивация, адаптация на новите служители.</p>
<p><b>Механизми за утвърждаване:</b> личният пример на ръководителите, подбор и въвеждане на нови хора (наставник), обучения, признание и награди, вътрешна комуникация (бюлетин, срещи), правилници и етичен кодекс.</p>
<p><b>Общоприети норми на поведение:</b> поздравяваме, спазваме работното време, пазим чистотата, уважаваме чуждото време и мнение, не говорим високо по телефона, не клюкарстваме.</p>`,
['Културата се утвърждава най-вече чрез личния пример на ръководството.']),
L('1.5','Приемане на посетители. Обработка на запитвания',2,`
<p><b>Посрещане на посетител:</b></p>
<ol><li>Станете или погледнете посетителя, усмихнете се и поздравете: „Добър ден, с какво мога да помогна?“</li><li>Изяснете кой е и по какъв въпрос идва. Проверете дали има уговорена среща.</li><li>Регистрирайте го в дневника за посетители, ако се изисква.</li><li>Уведомете служителя, при когото отива. Предложете място и вода, ако трябва да изчака.</li><li>Придружете посетителя или обяснете точно къде да отиде.</li></ol>
<p><b>Обработка на запитване (на място, по телефона, по имейл):</b> изслушване → изясняване → отговор или насочване към компетентния служител → записване → проследяване дали е решено.</p>
<p><b>Труден клиент:</b> запазете спокойствие, изслушайте без да прекъсвате, покажете разбиране („Разбирам, че това ви е неприятно“), предложете конкретно решение и срок. Не обещавайте нещо, което не можете да изпълните.</p>
<p><b>Удовлетвореност:</b> накрая попитайте „Има ли още нещо, с което да помогна?“. Използвайте анкета или книга за предложения.</p>`,
['Посрещане: поздрав → изясняване → уведомяване → насочване.','С труден клиент: спокойствие, разбиране, конкретно решение.'])
],
